syntax = "proto3";

package identity.profiles.v1;

import "google/protobuf/wrappers.proto";
import "identity/users/v1/users.proto";  // reuse FieldError
import "beekeeping/reference/v1/reference.proto";  // shared dictionaries (see spec §3.1)
import "common/geo/v1/geo.proto";  // Oblast — the single geographic dictionary

// ProfilesService owns the identity/profiles bounded context.
// gRPC domain service — no HTTP surface (except the SDK-provided
// `/avatars/{key}` handler mounted by the service itself, which is NOT
// an RPC and is not described here). client-gateway is the only external
// caller.
service ProfilesService {
  // Surface: client — called by the gateway on behalf of the authenticated user.
  //   The gateway MUST forward the authenticated user id as the request field
  //   `user_id` AND as gRPC metadata `x-authenticated-user-id` (see spec §4.4).
  rpc GetOwnProfile(GetOwnProfileRequest) returns (GetOwnProfileResponse);

  // Surface: client
  rpc UpdateProfile(UpdateProfileRequest) returns (UpdateProfileResponse);

  // Surface: client
  rpc UploadAvatar(UploadAvatarRequest) returns (UploadAvatarResponse);

  // Surface: client — public, no gateway auth. `user_id` comes from the path.
  rpc GetPublicProfile(GetPublicProfileRequest) returns (GetPublicProfileResponse);

  // Surface: client — the gateway MUST forward the authenticated user id as the
  //   request field `user_id` AND as gRPC metadata `x-authenticated-user-id`.
  rpc AddApiaryPhoto(AddApiaryPhotoRequest) returns (AddApiaryPhotoResponse);

  // Surface: client — the gateway MUST forward the authenticated user id as the
  //   request field `user_id` AND as gRPC metadata `x-authenticated-user-id`.
  rpc DeleteApiaryPhoto(DeleteApiaryPhotoRequest) returns (DeleteApiaryPhotoResponse);

  // Surface: client — the gateway MUST forward the authenticated user id as the
  //   request field `user_id` AND as gRPC metadata `x-authenticated-user-id`.
  rpc ReorderApiaryPhotos(ReorderApiaryPhotosRequest) returns (ReorderApiaryPhotosResponse);

  // Surface: client — the gateway MUST forward the authenticated user id as the
  //   request field `user_id` AND as gRPC metadata `x-authenticated-user-id`.
  rpc UploadVerificationDocument(UploadVerificationDocumentRequest) returns (UploadVerificationDocumentResponse);

  // Surface: client — OWNER ONLY. Returns the veterinary passport scan bytes
  //   for the authenticated user's own profile. The scan carries the owner's
  //   full name and the apiary address, so unlike lab analyses it is never
  //   served by the public /avatars handler (spec §3.5). Ownership is enforced
  //   entirely by the metadata contract below — there is no user_id path
  //   parameter and no way to name another user's document.
  //   The gateway MUST forward the authenticated user id as the request field
  //   `user_id` AND as gRPC metadata `x-authenticated-user-id`.
  rpc GetVerificationDocument(GetVerificationDocumentRequest) returns (GetVerificationDocumentResponse);

  // Surface: client — the gateway MUST forward the authenticated user id as the
  //   request field `user_id` AND as gRPC metadata `x-authenticated-user-id`.
  rpc AddLabAnalysis(AddLabAnalysisRequest) returns (AddLabAnalysisResponse);

  // Surface: internal — called by listings-service to render trust badges on a
  //   search result page. MUST NOT be exposed through client-gateway or any
  //   future admin-gateway. Like GetPublicProfile, an internal caller sends no
  //   `x-authenticated-user-id` metadata.
  rpc GetSellerTrustBadges(GetSellerTrustBadgesRequest) returns (GetSellerTrustBadgesResponse);

  // Surface: client — the BUYER of a dispatched order writes one review of its seller.
  //   Eligibility is not decided here: profile-service asks orders-service, which owns
  //   the state machine.
  rpc CreateOrderReview(CreateOrderReviewRequest) returns (CreateOrderReviewResponse);

  // Surface: client — the author retracts their own review during the withdrawal
  //   window, BEFORE it has ever been visible to anyone. Keyed by order_id, not
  //   review_id, so an author who no longer holds the create response can still
  //   reach it: they always know their own order.
  //
  //   This is NOT deletion of a published review, which does not exist and must
  //   never be added. Once visible, a review is permanent.
  rpc WithdrawOrderReview(WithdrawOrderReviewRequest) returns (WithdrawOrderReviewResponse);

  // Surface: client — the reviewed seller answers, once.
  rpc ReplyToOrderReview(ReplyToOrderReviewRequest) returns (ReplyToOrderReviewResponse);

  // Surface: internal — the ONLY write path that moves verification_status to
  //   VERIFIED or REJECTED, and therefore the only one that can emit
  //   ProfileVerificationChanged. Until this RPC existed those transitions
  //   happened by manual SQL, which no event can observe; a seller verified after
  //   publishing would have stayed unverified in the marketplace ranking forever.
  //   MUST NOT be exposed through client-gateway — a user setting their own
  //   verification flag defeats the entire feature.
  rpc SetVerificationStatus(SetVerificationStatusRequest) returns (SetVerificationStatusResponse);

  // Surface: client — the caller's OWN seasonal work calendar (TASK-76).
  //   Identity from metadata; there is no user_id on the request, because a
  //   calendar personalised by somebody else's oblast is not a feature.
  //
  //   SHIPS WITH AN EMPTY DICTIONARY, deliberately. The content is agronomic
  //   expertise and TASK-76 blocks itself until a named author signs the
  //   dates: telling a beekeeper to treat for varroa in the wrong week costs
  //   colonies. The storage enforces it — `authored_by` is NOT NULL — so this
  //   RPC returning an empty list is the honest state, not a bug.
  rpc GetApiaryCalendar(GetApiaryCalendarRequest) returns (GetApiaryCalendarResponse);

  // Surface: client — "зроблено" for one work item in one season. Without it
  //   reminders become noise and get switched off, which is the card's own
  //   reasoning for including it in the first cut.
  rpc MarkApiaryWorkDone(MarkApiaryWorkDoneRequest) returns (MarkApiaryWorkDoneResponse);

  // Surface: internal — required by platform convention.
  rpc Ping(PingRequest) returns (PingResponse);
}

message PingRequest {}
message PingResponse { int64 server_time_ms = 1; }

// Do not redefine FieldError — reuse `identity.users.v1.FieldError`.

enum ProfileSpecialization {
  PROFILE_SPECIALIZATION_UNSPECIFIED = 0;  // Not set by user yet
  PROFILE_SPECIALIZATION_BEEKEEPER   = 1;
  PROFILE_SPECIALIZATION_AGRI        = 2;
  PROFILE_SPECIALIZATION_VET         = 3;
  PROFILE_SPECIALIZATION_OTHER       = 4;
}

// Verification lifecycle. Distinct from "a document was uploaded" — a
// document being submitted and a document being ACCEPTED are different
// facts (spec §3.2). The buyer-facing badge renders only on VERIFIED, but a
// PENDING document is still shown to buyers.
//
// NOT writable through UpdateProfile. Set to PENDING by the service itself
// when a document is uploaded; VERIFIED / REJECTED are reachable only through
// the internal SetVerificationStatus RPC, which is the sole write path that
// emits ProfileVerificationChanged. Do not reintroduce a manual-SQL transition:
// a status changed behind the service's back produces no event, and the
// marketplace's verification-first ranking would never see it.
enum VerificationStatus {
  VERIFICATION_STATUS_UNSPECIFIED = 0;  // Never emitted by the service; reserved.
  VERIFICATION_STATUS_NONE        = 1;  // DB 'none' — nothing submitted.
  VERIFICATION_STATUS_PENDING     = 2;  // DB 'pending' — submitted, awaiting review.
  VERIFICATION_STATUS_VERIFIED    = 3;  // DB 'verified'.
  VERIFICATION_STATUS_REJECTED    = 4;  // DB 'rejected'.
}

// Full — returned by GetOwnProfile / UpdateProfile.
message Profile {
  // location_region was a free-text `string` here. It is now the closed
  // dictionary common.geo.v1.Oblast at field 26. `string` is wire type 2 and
  // `enum` is varint wire type 0, so the type could not change in place —
  // old and new peers would fail to decode rather than degrade. Field 3 is
  // burned permanently; an old client's value now arrives as an unknown field
  // and is skipped.
  //
  // Only the NUMBER is reserved, not the name: the name is deliberately
  // carried forward to field 26 so the JSON/HTTP key stays `location_region`
  // and only its value domain changes. protoc forbids reusing a reserved
  // name, so `reserved "location_region";` and the rename are mutually
  // exclusive — reserving 3 is what prevents the decode mismatch.
  reserved 3;

  string                user_id            = 1;
  optional string       display_name       = 2;
  optional string       location_city      = 4;
  optional string       bio                = 5;
  ProfileSpecialization specialization     = 6;
  optional int32        hive_count         = 7;
  optional string       avatar_url         = 8;
  bool                  show_contact_email = 9;
  bool                  show_contact_phone = 10;
  int64                 created_at_ms      = 11;
  int64                 updated_at_ms      = 12;

  optional int32                              started_beekeeping_year    = 13;  // e.g. 2019; client derives the duration
  repeated beekeeping.reference.v1.BeeBreed   bee_breeds                 = 14;
  repeated beekeeping.reference.v1.HoneyType  honey_types                = 15;
  optional beekeeping.reference.v1.ApiaryKind apiary_kind                = 16;
  bool                                        open_for_visits            = 17;
  optional string                             vet_passport_number        = 18;
  // NOT a URL. The passport scan is owner-only (spec §3.5) and is fetched
  // through client-gateway's GET /me/verification/passport, a fixed path, so
  // no URL needs to travel on the profile. This flag only tells the owner's
  // client whether there is a document to fetch.
  bool                                        has_vet_passport_document  = 19;
  optional string                             apiary_registration_number = 20;
  VerificationStatus                          verification_status        = 21;  // read-only
  optional string                             verified_by                = 22;  // read-only; 'union' | 'admin'
  optional int64                              verified_at_ms             = 23;  // read-only
  repeated ApiaryPhoto                        photos                     = 24;  // ordered by position ASC
  repeated LabAnalysis                        lab_analyses               = 25;  // ordered by analysed_at DESC
  // Replaces the reserved field 3. Absent = the seller has not stated an
  // oblast; OBLAST_UNSPECIFIED is never emitted for a stored value.
  optional common.geo.v1.Oblast               location_region            = 26;
  // Live counters from orders-service (spec 3.1). ABSENT means the source
  // was unreachable, which is NOT the same fact as a seller with zero
  // completed orders: zero is a statement about the seller, absent is a
  // statement about the platform. Never render zeros on failure.
  //
  // Present here as well as on PublicProfile because there is no privileged
  // view: what a seller sees on their own profile is exactly what a buyer
  // sees, eligibility rule included. Showing a seller a statistic buyers
  // cannot see would make them optimise against a number nobody reads;
  // hiding one buyers can see would be dishonest.
  //
  // Field 27 here versus 25 on PublicProfile — the divergence is the same
  // one that runs through both messages from field 16 onward. Do not try to
  // align them.
  optional SellerOrderStats                   seller_order_stats         = 27;
}

// Redacted — returned by GetPublicProfile. NB: no visibility flags, no contact values,
// no updated_at. The visibility flags (show_contact_email / show_contact_phone)
// remain absent by design — their state is inferred only from whether
// contact_email / contact_phone are present. The veterinary passport SCAN is
// absent by design too: no URL and not even a has-document flag, because
// verification_status already conveys that a document was submitted (spec §3.5).
//
// Numbering deliberately diverges from `Profile` from field 16 onward: `Profile`
// carries `has_vet_passport_document` at 19 and this message carries no
// passport-scan field at all. Do not try to keep the two numerically aligned.
message PublicProfile {
  // Same wire break as Profile: field 3 held the free-text `string`, and the
  // Oblast enum lives at field 24. Number reserved, name carried forward —
  // see the note on Profile.
  reserved 3;

  // Fields 15 and 16 held `vet_passport_number` and `apiary_registration_number`
  // as VALUES. They were removed, not deprecated. This message is returned on a
  // PUBLIC, UNAUTHENTICATED surface (client-gateway `GET /profile/{user_id}`),
  // and a public surface that carries document identifiers is a register.
  // `public-profile-view-spec` §3.4 is unconditional about this and explicitly
  // overrides `profile-extended-spec` §3.5, which had argued the passport
  // number was a buyer-facing signal. The presence flags at 26 and 27 carry the
  // trust signal; the numbers themselves carry nothing a buyer can verify,
  // because they are self-asserted free text with no format validation and no
  // proof of ownership. The names are reserved so the fields cannot be
  // reintroduced under the same key.
  reserved 15, 16;
  reserved "vet_passport_number", "apiary_registration_number";

  string                user_id         = 1;
  optional string       display_name    = 2;
  optional string       location_city   = 4;
  optional string       bio             = 5;
  ProfileSpecialization specialization  = 6;
  optional int32        hive_count      = 7;
  optional string       avatar_url      = 8;
  int64                 created_at_ms   = 9;

  optional int32                              started_beekeeping_year    = 10;
  repeated beekeeping.reference.v1.BeeBreed   bee_breeds                 = 11;
  repeated beekeeping.reference.v1.HoneyType  honey_types                = 12;
  optional beekeeping.reference.v1.ApiaryKind apiary_kind                = 13;
  bool                                        open_for_visits            = 14;
  // The document NUMBERS that used to sit here at 15 and 16 are gone; see the
  // reservation at the top of this message. The SCAN remains deliberately
  // absent too — no URL, and not even a has-document flag, because
  // verification_status already conveys that a document was submitted.
  VerificationStatus                          verification_status        = 17;
  optional string                             verified_by                = 18;
  optional int64                              verified_at_ms             = 19;
  repeated ApiaryPhoto                        photos                     = 20;
  repeated LabAnalysis                        lab_analyses               = 21;  // public by design (spec §3.5)
  // Populated ONLY when the profile owner set the corresponding visibility
  // flag AND profile-service could reach users-service. Absent when the flag
  // is off, and absent (never an error) when users-service is unreachable.
  // PublicProfile still carries NO show_contact_* flags — their state is
  // inferred only from whether the value is present.
  optional string                             contact_email              = 22;
  optional string                             contact_phone              = 23;
  // Replaces the reserved field 3. Numbering diverges from Profile (26) for
  // the same reason the rest of this message does — do not try to align them.
  optional common.geo.v1.Oblast               location_region            = 24;
  // Live counters from orders-service (spec 3.1). ABSENT means the source
  // was unreachable, which is NOT the same fact as a seller with zero
  // completed orders: zero is a statement about the seller, absent is a
  // statement about the platform. Never render zeros on failure.
  optional SellerOrderStats                   seller_order_stats         = 25;
  // Presence, NEVER the value — the same rule `SellerTrustBadge` below follows.
  // These exist so the public profile page can render the same verification
  // badge the listing card renders, and so listings-service has a presence
  // source now that the values are gone.
  bool                                        has_vet_passport_number        = 26;
  bool                                        has_apiary_registration_number = 27;
}

// One image in a seller's apiary gallery. Maximum 10 per user.
message ApiaryPhoto {
  string photo_id      = 1;  // ULID.
  string url           = 2;  // Absolute URL, derived from the stored file key.
  int32  position      = 3;  // 0-based, contiguous, ascending display order.
  int64  created_at_ms = 4;
}

// One honey laboratory analysis. Maximum 5 per user.
message LabAnalysis {
  string          analysis_id      = 1;  // ULID.
  string          url              = 2;  // Absolute URL of the scan/PDF.
  int64           analysed_at_ms   = 3;  // When the lab performed the analysis.
  optional double diastase_number  = 4;  // Gothe units. Absent = not reported.
  optional double moisture_percent = 5;  // 0..100. Absent = not reported.
  optional bool   has_antibiotics  = 6;  // Absent = not tested / not reported.
  int64           created_at_ms    = 7;  // When it was uploaded here.
}

// The search-page projection of a seller's trust signals (spec §4.4).
// PRESENCE FLAGS AND A COUNT, never document identifiers — see the note on
// marketplace.listings.v1.SellerTrustBadge, which mirrors this message.
//
// Deliberately far lighter than PublicProfile: a catalogue page fetches this for
// up to 50 sellers at once, and PublicProfile would ship every apiary photo, every
// lab analysis and both contact values to render a badge.
message SellerTrustBadge {
  string             seller_id                      = 1;
  VerificationStatus verification_status            = 2;
  bool               has_vet_passport_number        = 3;
  bool               has_apiary_registration_number = 4;
  int32              lab_analyses_count             = 5;
}

// Live order counters for this seller, read from orders-service on every
// profile read and never stored here (spec 3.1). Deliberately mirrors
// marketplace.orders.v1.GetSellerOrderStatsSuccess field-for-field —
// same names AND same field numbers — so a reader comparing the two does
// not have to translate. It is a mirror rather than an import because
// identity.profiles.v1 must not take a package dependency on
// marketplace.orders.v1 for seven scalars.
//
// There is no average, no score and no star here, and none may be added:
// a number that can be minted for free crowds out the signals that cannot.
//
// NB: a NEIGHBOUR of SellerTrustBadge, never to be merged into it.
// SellerTrustBadge carries verification presence flags; this carries order
// counters. They answer different questions and are fetched on different
// paths — the badge is batched for up to 50 sellers on a catalogue page,
// this is per-profile.
message SellerOrderStats {
  int32 completed_orders_count    = 1;
  int32 buyer_cancellation_count  = 2;
  int32 seller_cancellation_count = 3;
  // ABSENT — not zero — whenever stats_display_eligible is false.
  // This is the ONE place the mirror diverges from the orders message,
  // where the field is a plain int32. orders-service returns the number
  // regardless and only documents that callers must not show it;
  // profile-service applies that rule here by leaving the field unset, so
  // no client can opt out of it and no client has to be trusted to obey a
  // comment. One refusal in fifty reads differently from one in one, and
  // only the pair is informative.
  optional int32 unresolved_count = 4;
  // Copied verbatim from orders-service. profile-service does NOT
  // recompute it: two components deciding the same question two ways is
  // how they eventually disagree.
  bool  stats_display_eligible    = 5;
  // Distinct BUYERS across this seller's COMPLETED orders only — the
  // denominator that makes completed_orders_count mean something. Twenty
  // orders from one buyer and twenty from twenty buyers are the same number
  // without it, and the first shape is what two colluding accounts produce
  // for free. Counted over completed orders only, matching
  // completed_orders_count, so the pair reads as a fraction; counting
  // distinct buyers across ALL statuses would let a colluder inflate the
  // denominator with cancellations and invert the signal.
  int32 distinct_counterparty_count = 6;
  // Requests this seller DECLINED, kept separate from
  // seller_cancellation_count on purpose: declining a request costs a buyer
  // a few days, abandoning a CONFIRMED order in May costs them the season.
  // Folding the two together would make a cautious seller who declines what
  // he cannot fill look identical to one who strands buyers after
  // committing.
  int32 rejected_count              = 7;
}

// ---- Order reviews ----------------------------------------------------------

// One buyer's account of one order, about its seller.
//
// THERE IS NO SCORE HERE, AND NONE MAY BE ADDED — no star, no thumb, no numeric
// rating, and no COUNT of reviews either. A count is a score wearing a different
// hat: "47 reviews" ranks sellers by volume just as an average ranks them by
// sentiment, and both are minted for free by anyone willing to transact with
// themselves. Text is expensive to fake convincingly and a reader can tell. That
// asymmetry is the entire reason this surface exists, and the same rule already
// stated on SellerOrderStats applies here without exception.
//
// The reply is NESTED, never a sibling list. A reply is meaningless without the
// review it answers, and nesting makes "the reply is never returned alone" a
// property of the schema rather than a rule the mappers are trusted to keep.
//
// ORDERS THAT ENDED BADLY PRODUCE REVIEWS. Eligibility is decided by
// orders-service, and it admits COMPLETED, CLOSED_REPLACED and CLOSED_UNRESOLVED
// alike — the rule is that the order concluded after the seller was committed to
// dispatch, not that goods changed hands. A surface that carried only the happy
// endings would be flattering rather than neutral, and the buyer whose parcel
// never arrived is the reader this exists for. profile-service never learns which
// of those states an order is in; it only learns that a review is permitted.
message OrderReview {
  string                    review_id       = 1;
  string                    order_id        = 2;
  string                    seller_id       = 3;  // the subject
  string                    buyer_id        = 4;  // the author
  string                    body            = 5;
  int64                     published_at_ms = 6;
  optional OrderReviewReply reply           = 7;
}

// The reviewed seller's single answer. Displayed with its review, never above it.
// One reply, not a thread: a conversation invites escalation and the reader is
// not a jury. The seller gets the last word by construction — that asymmetry is
// deliberate compensation for the buyer having spoken first.
message OrderReviewReply {
  string reply_id        = 1;
  string review_id       = 2;
  string seller_id       = 3;
  string body            = 4;
  int64  published_at_ms = 5;
}

// Presence wrappers for the multi-value dictionary fields on UpdateProfile.
// proto3 `repeated` has no presence, so a bare repeated field cannot
// distinguish "leave this list alone" from "replace it with the empty list".
// Wrapping in a message restores presence and keeps the established
// tri-state convention intact:
//   - field absent                    = leave unchanged
//   - field present, values empty     = CLEAR (write '{}')
//   - field present, values non-empty = replace wholesale (no partial add/remove)
message BeeBreedList  { repeated beekeeping.reference.v1.BeeBreed  values = 1; }
message HoneyTypeList { repeated beekeeping.reference.v1.HoneyType values = 1; }

// ---- GetOwnProfile ----------------------------------------------------------

message GetOwnProfileRequest {
  string user_id = 1;
  // Opaque cursor from a previous response's `next_reviews_cursor`. Absent = first page.
  optional string reviews_cursor    = 2;
  // Default 20, hard max 50. A value above the cap is CLAMPED, not rejected —
  // matching SearchListings.
  optional int32  reviews_page_size = 3;
}
message GetOwnProfileResponse {
  oneof result {
    GetOwnProfileSuccess success = 1;
    GetOwnProfileError   error   = 2;
  }
}
// Reviews ride this ENVELOPE, not `Profile` — see the note on
// GetPublicProfileSuccess, including why there is no `total_count` here either.
message GetOwnProfileSuccess {
  Profile profile = 1;
  // Reviews OF this seller, newest first. Always present; `[]` when there are none.
  repeated OrderReview reviews = 2;
  // Absent on the last page. There is deliberately NO total — see
  // GetPublicProfileSuccess.
  optional string next_reviews_cursor = 3;
}
enum GetOwnProfileErrorCode {
  GET_OWN_PROFILE_ERROR_CODE_UNSPECIFIED = 0;
  GET_OWN_PROFILE_ERROR_CODE_NOT_FOUND   = 1;
  GET_OWN_PROFILE_ERROR_CODE_INTERNAL    = 2;
}
message GetOwnProfileError { GetOwnProfileErrorCode code = 1; string message = 2; }

// ---- UpdateProfile ----------------------------------------------------------
//
// Tri-state semantics per spec §8.1 (decision (a)):
//   - Field absent (StringValue not set)             = leave field unchanged.
//   - Field present with empty string / value = 0    = CLEAR the field (write NULL / 0 as appropriate).
// Wrapper types (google.protobuf.StringValue, Int32Value, BoolValue) express this
// unambiguously because presence is checked via `has_*` on the wrapper.
// For the enum `specialization`, plain proto3 `optional` is sufficient:
// absent = no change, UNSPECIFIED = do NOT clear (treat as no change),
// any other = write that value.

message UpdateProfileRequest {
  // Field 3 held location_region as a google.protobuf.StringValue. The field
  // is now the closed dictionary common.geo.v1.Oblast at field 17 — a wire
  // break (length-delimited message -> varint enum), so the number is burned
  // rather than reused. Number reserved, name carried forward — see the note
  // on Profile.
  reserved 3;

  string                                user_id            = 1;
  google.protobuf.StringValue           display_name       = 2;
  google.protobuf.StringValue           location_city      = 4;
  google.protobuf.StringValue           bio                = 5;
  optional ProfileSpecialization        specialization     = 6;
  google.protobuf.Int32Value            hive_count         = 7;
  google.protobuf.BoolValue             show_contact_email = 8;
  google.protobuf.BoolValue             show_contact_phone = 9;

  // Tri-state, same convention as fields 2..9:
  //   Int32Value  : absent = unchanged; present with 0 = CLEAR (write NULL);
  //                 present with n = set. Same mapper as hive_count — see
  //                 int32_wrapper_to_update. This is exactly why experience is
  //                 stored as started_beekeeping_year and not as a duration
  //                 (spec §3.4): year 0 is not a value anyone can mean, so the
  //                 clear sentinel is unambiguous, whereas years_experience = 0
  //                 (a first-season beekeeper) would have been silently
  //                 swallowed as "not stated".
  //   StringValue : absent = unchanged; present empty = CLEAR; present = set.
  //   BoolValue   : absent = unchanged; present = set. open_for_visits is
  //                 NOT NULL in the DB and therefore has no clear state.
  //   BeeBreedList / HoneyTypeList (message presence):
  //                 absent = unchanged; present with values = [] = CLEAR;
  //                 present with values = wholesale replace. There is no
  //                 partial add/remove — the client sends the full list.
  //                 Any UNSPECIFIED member is INVALID_INPUT, not a no-op.
  //   apiary_kind (proto3 optional enum): absent = unchanged;
  //                 present with APIARY_KIND_UNSPECIFIED = CLEAR (write NULL);
  //                 present with a real value = set.
  //                 *** This is deliberately DIFFERENT from `specialization`
  //                 (field 6), where UNSPECIFIED means "no change" because
  //                 profiles.specialization is NOT NULL. profiles.apiary_kind
  //                 IS nullable, so it needs a clear signal. Do not
  //                 copy-paste the specialization mapper. ***
  //   location_region (proto3 optional enum, field 17): absent = unchanged;
  //                 present with OBLAST_UNSPECIFIED = CLEAR (write NULL);
  //                 present with a real value = set.
  //                 *** This follows the `apiary_kind` rule, NOT the
  //                 `specialization` rule. profiles.location_region is
  //                 nullable, so it needs a clear signal and UNSPECIFIED must
  //                 mean CLEAR. Reusing the specialization mapper here would
  //                 make the field impossible to clear once set. ***
  //
  // DELIBERATELY ABSENT and MUST NEVER BE ADDED: verification_status,
  // verified_by, verified_at_ms, has_vet_passport_document / the passport
  // file key, photos, lab_analyses. A user setting their own verification
  // flag defeats the entire feature (spec §4.2). Verification status is
  // written only by the service itself (on document upload) and by the
  // internal SetVerificationStatus RPC, which is never exposed to a client.
  google.protobuf.Int32Value                  started_beekeeping_year    = 10;
  BeeBreedList                                bee_breeds                 = 11;
