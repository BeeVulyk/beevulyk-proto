// ---- GetPublicProfile -------------------------------------------------------

message GetPublicProfileRequest {
  string user_id = 1;
  // Opaque cursor from a previous response's `next_reviews_cursor`. Absent = first page.
  optional string reviews_cursor    = 2;
  // Default 20, hard max 50. A value above the cap is CLAMPED, not rejected —
  // matching SearchListings.
  optional int32  reviews_page_size = 3;
}
message GetPublicProfileResponse {
  oneof result {
    GetPublicProfileSuccess success = 1;
    GetPublicProfileError   error   = 2;
  }
}
// The review list rides this ENVELOPE and NOT `PublicProfile` / `Profile`, which
// gain no field: a cursor has to sit beside the list it pages, and this repo
// already puts caller-relative and request-relative facts on the envelope
// (marketplace.orders.v1.GetOrderSuccess.contacts_released) rather than on the
// entity. `Profile` field 28 and `PublicProfile` field 26 stay free.
message GetPublicProfileSuccess {
  PublicProfile profile = 1;
  // Reviews OF this seller, newest first. Always present; `[]` when there are none.
  repeated OrderReview reviews = 2;
  // Absent on the last page.
  //
  // NOTE THE ABSENCE OF `total_count`, which SearchListingsSuccess does carry.
  // It is left out deliberately and must not be added: a total here IS the review
  // count, which is the aggregate this whole feature refuses to publish. Pagination
  // that needs a total is pagination that has invented a score.
  optional string next_reviews_cursor = 3;
}
enum GetPublicProfileErrorCode {
  GET_PUBLIC_PROFILE_ERROR_CODE_UNSPECIFIED = 0;
  GET_PUBLIC_PROFILE_ERROR_CODE_NOT_FOUND   = 1;
  GET_PUBLIC_PROFILE_ERROR_CODE_INTERNAL    = 2;
}
message GetPublicProfileError { GetPublicProfileErrorCode code = 1; string message = 2; }

