// ---- CreateOrderReview ------------------------------------------------------
// Client. NO PARTY ID IN THE BODY: the author's identity arrives as
// `x-authenticated-user-id` metadata, as on every client RPC in this package.
// An order id is carried as a plain string — this package must NOT import
// marketplace.orders.v1, and nothing from it is needed.

message CreateOrderReviewRequest {
  string order_id = 1;
  string body     = 2;
}
message CreateOrderReviewResponse {
  oneof result {
    CreateOrderReviewSuccess success = 1;
    CreateOrderReviewError   error   = 2;
  }
}
message CreateOrderReviewSuccess {
  OrderReview review = 1;
  // Until when the author may withdraw it, and — the same instant — when it first
  // becomes visible to anyone else. On the ENVELOPE and not on OrderReview because
  // it is a fact about this caller's remaining options, not about the review.
  int64       withdrawable_until_ms = 2;
}
enum CreateOrderReviewErrorCode {
  CREATE_ORDER_REVIEW_ERROR_CODE_UNSPECIFIED          = 0;
  CREATE_ORDER_REVIEW_ERROR_CODE_INVALID_INPUT        = 1;
  // No such order, or the caller is not a party to it. One code, deliberately.
  CREATE_ORDER_REVIEW_ERROR_CODE_ORDER_NOT_FOUND      = 2;
  // The caller is a party, but the seller. They can already see this order, so
  // pretending it does not exist would be a lie to someone looking at it.
  CREATE_ORDER_REVIEW_ERROR_CODE_NOT_THE_BUYER        = 3;
  // The order never reached a reviewable state. The state itself is not disclosed.
  CREATE_ORDER_REVIEW_ERROR_CODE_ORDER_NOT_REVIEWABLE = 4;
  // A live review already exists for this order.
  CREATE_ORDER_REVIEW_ERROR_CODE_ALREADY_REVIEWED     = 5;
  CREATE_ORDER_REVIEW_ERROR_CODE_INTERNAL             = 6;
}
message CreateOrderReviewError {
  CreateOrderReviewErrorCode            code    = 1;
  string                                message = 2;
  repeated identity.users.v1.FieldError fields  = 3;
}

// ---- WithdrawOrderReview ----------------------------------------------------
// Client. Keyed by order_id, not review_id — see the RPC comment. This is the
// ONLY removal path in the package and it closes when the review becomes
// visible; there is no edit path at any point in the lifecycle.

message WithdrawOrderReviewRequest { string order_id = 1; }
message WithdrawOrderReviewResponse {
  oneof result {
    WithdrawOrderReviewSuccess success = 1;
    WithdrawOrderReviewError   error   = 2;
  }
}
message WithdrawOrderReviewSuccess {}
enum WithdrawOrderReviewErrorCode {
  WITHDRAW_ORDER_REVIEW_ERROR_CODE_UNSPECIFIED   = 0;
  WITHDRAW_ORDER_REVIEW_ERROR_CODE_INVALID_INPUT = 1;
  // No live review for that order authored by this caller.
  WITHDRAW_ORDER_REVIEW_ERROR_CODE_NOT_FOUND     = 2;
  // It exists and is theirs, but the window has closed and it is now public.
  WITHDRAW_ORDER_REVIEW_ERROR_CODE_WINDOW_CLOSED = 3;
  WITHDRAW_ORDER_REVIEW_ERROR_CODE_INTERNAL      = 4;
}
message WithdrawOrderReviewError {
  WithdrawOrderReviewErrorCode          code    = 1;
  string                                message = 2;
  repeated identity.users.v1.FieldError fields  = 3;
}

// ---- ReplyToOrderReview -----------------------------------------------------
// Client. The reviewed seller answers once. The reply comes back NESTED inside
// its review, never on its own.

message ReplyToOrderReviewRequest {
  string review_id = 1;
  string body      = 2;
}
message ReplyToOrderReviewResponse {
  oneof result {
    ReplyToOrderReviewSuccess success = 1;
    ReplyToOrderReviewError   error   = 2;
  }
}
message ReplyToOrderReviewSuccess { OrderReview review = 1; }  // the review WITH its new reply
enum ReplyToOrderReviewErrorCode {
  REPLY_TO_ORDER_REVIEW_ERROR_CODE_UNSPECIFIED     = 0;
  REPLY_TO_ORDER_REVIEW_ERROR_CODE_INVALID_INPUT   = 1;
  // No visible review with that id.
  REPLY_TO_ORDER_REVIEW_ERROR_CODE_NOT_FOUND       = 2;
  // The review is visible and the caller is not its seller. NOT collapsed into
  // NOT_FOUND: a published review is PUBLIC, so hiding its existence from someone
  // who can read it on the profile page would be a lie about something they can see.
  REPLY_TO_ORDER_REVIEW_ERROR_CODE_NOT_THE_SELLER  = 3;
  REPLY_TO_ORDER_REVIEW_ERROR_CODE_ALREADY_REPLIED = 4;
  REPLY_TO_ORDER_REVIEW_ERROR_CODE_INTERNAL        = 5;
}
message ReplyToOrderReviewError {
  ReplyToOrderReviewErrorCode           code    = 1;
  string                                message = 2;
  repeated identity.users.v1.FieldError fields  = 3;
}

// ---- NO MODERATION SURFACE OF ANY KIND, AND NO SELLER-REVIEWS-BUYER SURFACE --
//
// No report RPC, no takedown RPC, no moderation status field, no admin RPC, and
// no comment or string implying the platform reads, reviews or endorses what is
// written. TASK-66 settled it: an interface that invites a complaint and then
// does nothing leaves the user worse off than no mechanism at all, and there is
// no admin-gateway to route one to. Do not add one "for later".
//
// No `BuyerReview`, no `reviewee_role`, no symmetry. Nobody browses buyers, so a
// review of one would have no reader; what it would actually do is deter honest
// buyer reviews, because a critical one would invite a retaliatory one that
// follows the buyer around.

// ---- Apiary calendar (TASK-76) ----------------------------------------------
//
// The MECHANISM only. Every table behind this ships empty; see the RPC comments
// and `migrations/20260828180000_apiary_calendar.sql`.

// One seasonal job, already resolved against a year and the caller's oblast.
//
// The window arrives as two calendar DATES rather than a month/day pair,
// because resolving "15 April plus the Kherson shift" is the service's job and
// doing it twice — once here, once in an app — is how the two drift apart.
message ApiaryWorkItem {
  string code               = 1;
  string title              = 2;
  // Why it matters and what missing the window costs. A date alone is a nag.
  string explanation        = 3;
  // `YYYY-MM-DD`, inclusive, already shifted for the caller's oblast. A window
  // may wrap the new year, in which case `window_end` is in the next year.
  string window_start       = 4;
  string window_end         = 5;
  // Days before `window_start` at which a reminder is due. Carried so a client
  // can show "in N days" without a second round trip; NOTHING SENDS IT YET —
  // there is no reminder worker, and push reaches nobody while the app does
  // not exist.
  int32  reminder_lead_days = 6;
  // Catalogue category this job sends the beekeeper to, e.g. `vet_preparation`.
  // Empty where the job needs nothing bought — forcing every reminder to sell
  // something is how a useful calendar turns into an ad.
  string linked_category    = 7;
  // Whether THIS caller has marked it done for this season.
  bool   done               = 8;
  // Who authored these dates and stands behind them. Never empty: the column
  // is NOT NULL precisely so unsigned agronomic advice cannot be served.
  string authored_by        = 9;
}

message GetApiaryCalendarRequest {
  // `0` means the current season. Explicit years let a client show last year
  // without a clock argument.
  int32 season_year = 1;
}

message GetApiaryCalendarResponse {
  oneof result {
    GetApiaryCalendarSuccess success = 1;
    GetApiaryCalendarError   error   = 2;
  }
}

message GetApiaryCalendarSuccess {
  // Ordered by resolved `window_start`. EMPTY until content is authored, and
  // an empty list is a valid answer rather than an error.
  repeated ApiaryWorkItem items       = 1;
  int32                   season_year = 2;
  // The oblast the windows were shifted for, as a slug; empty when the caller
  // has not set one — in which case the base windows are returned unshifted
  // and the client should say so rather than implying local accuracy.
  string                  oblast      = 3;
}

enum GetApiaryCalendarErrorCode {
  GET_APIARY_CALENDAR_ERROR_CODE_UNSPECIFIED   = 0;
  GET_APIARY_CALENDAR_ERROR_CODE_INVALID_INPUT = 1;
  GET_APIARY_CALENDAR_ERROR_CODE_INTERNAL      = 2;
}

message GetApiaryCalendarError {
  GetApiaryCalendarErrorCode code    = 1;
  string                     message = 2;
  repeated identity.users.v1.FieldError fields = 3;
}

message MarkApiaryWorkDoneRequest {
  string code        = 1;
  // `0` means the current season.
  int32  season_year = 2;
}

message MarkApiaryWorkDoneResponse {
  oneof result {
    MarkApiaryWorkDoneSuccess success = 1;
    MarkApiaryWorkDoneError   error   = 2;
  }
}

message MarkApiaryWorkDoneSuccess {
  string code        = 1;
  int32  season_year = 2;
}

enum MarkApiaryWorkDoneErrorCode {
  MARK_APIARY_WORK_DONE_ERROR_CODE_UNSPECIFIED   = 0;
  MARK_APIARY_WORK_DONE_ERROR_CODE_INVALID_INPUT = 1;
  // No work item with this code. Not an existence oracle worth hiding: the
  // dictionary is the same for every user and a client can read it all.
  MARK_APIARY_WORK_DONE_ERROR_CODE_NOT_FOUND     = 2;
  MARK_APIARY_WORK_DONE_ERROR_CODE_INTERNAL      = 3;
}

message MarkApiaryWorkDoneError {
  MarkApiaryWorkDoneErrorCode code    = 1;
  string                      message = 2;
  repeated identity.users.v1.FieldError fields = 3;
}
