syntax = "proto3";

package identity.users.v1;

// UsersService owns the identity/users bounded context.
// This is a gRPC domain service — no HTTP. The public client-gateway
// is the only caller of RegisterUser in this bootstrap feature.
service UsersService {
  // Surface: client
  // Creates a new user account in unverified state and publishes
  // UserRegistered to Kafka topic `identity.users.registered`.
  rpc RegisterUser(RegisterUserRequest) returns (RegisterUserResponse);

  // Surface: internal
  // Required by platform convention.
  rpc Ping(PingRequest) returns (PingResponse);

  // Surface: client
  // Verifies email+password credentials, returns a short-lived RS256 JWT plus a
  // rotating opaque refresh token, and publishes UserLoggedIn to Kafka topic
  // `identity.users.logged_in`.
  rpc LoginUser(LoginUserRequest) returns (LoginUserResponse);

  // Surface: client
  // Exchanges a refresh token for a fresh access+refresh pair. The presented
  // refresh token is single-use: on success it is revoked and a NEW one is
  // returned. If a rotated (already-used) token is presented again, the entire
  // family for that user is revoked and REUSE_DETECTED is returned.
  rpc RefreshToken(RefreshTokenRequest) returns (RefreshTokenResponse);

  // Surface: client
  // Revokes the given refresh token. Idempotent — returns Success even if the
  // token was unknown or already revoked, to avoid leaking existence.
  rpc Logout(LogoutRequest) returns (LogoutResponse);

  // Surface: internal
  // Resolves a user's contact values by user id. Two callers, both server-side:
  //   1. profile-service — to populate PublicProfile.contact_email / contact_phone
  //      when the profile owner has switched the corresponding visibility flag on.
  //   2. client-gateway — to release an order counterparty's contacts when
  //      marketplace.orders.v1.GetOrder answers `contacts_released = true`
  //      (cart-order-creation #47). This is a TRANSACTIONAL entitlement decided by
  //      orders-service, deliberately NOT the profile's show_contact_* display flags.
  //
  // MUST NOT be exposed as a client-gateway or admin-gateway ROUTE. Being called by
  // the gateway server-side is not the same as being proxied: this RPC is an
  // existence oracle for user ids and returns PII unconditionally, so the
  // authorization decision must always live in the calling service (profile-service's
  // visibility flags, orders-service's contacts_released), never here.
  //
  // Single-id by design. A batch variant is a clean additive follow-up if
  // marketplace listings ever need to resolve N sellers at once.
  rpc GetUserContacts(GetUserContactsRequest) returns (GetUserContactsResponse);
}

message PingRequest {}

message PingResponse {
  int64 server_time_ms = 1;
}

enum UserRole {
  USER_ROLE_UNSPECIFIED = 0;  // Treated as USER_ROLE_BEEKEEPER at the service.
  USER_ROLE_BEEKEEPER  = 1;
  USER_ROLE_AGRI       = 2;
  USER_ROLE_VET        = 3;
  USER_ROLE_OTHER      = 4;
}

message RegisterUserRequest {
  string   email    = 1;  // required; normalized to lowercase server-side.
  string   phone    = 2;  // required; E.164 (`^\+[1-9]\d{7,14}$`).
  string   password = 3;  // required; plaintext over TLS from gateway.
  UserRole role     = 4;  // optional; UNSPECIFIED -> BEEKEEPER.
}

message RegisterUserResponse {
  oneof result {
    RegisterUserSuccess success = 1;
    RegisterUserError   error   = 2;
  }
}

message RegisterUserSuccess {
  string   user_id        = 1;  // ULID (26-char Crockford base32).
  string   email          = 2;
  string   phone          = 3;
  UserRole role           = 4;
  bool     email_verified = 5;  // Always false at creation.
  bool     phone_verified = 6;  // Always false at creation.
  int64    created_at_ms  = 7;  // int64 milliseconds since epoch.
}

enum RegisterUserErrorCode {
  REGISTER_USER_ERROR_CODE_UNSPECIFIED   = 0;
  REGISTER_USER_ERROR_CODE_INVALID_INPUT = 1;  // Any validation failure.
  REGISTER_USER_ERROR_CODE_EMAIL_TAKEN   = 2;  // Unique-constraint violation on email.
  REGISTER_USER_ERROR_CODE_PHONE_TAKEN   = 3;  // Unique-constraint violation on phone.
  REGISTER_USER_ERROR_CODE_INTERNAL      = 4;
}

message FieldError {
  string field  = 1;  // e.g. "email", "phone", "password", "role".
  string reason = 2;  // machine-friendly slug, e.g. "invalid_format", "too_short".
}

message RegisterUserError {
  RegisterUserErrorCode code    = 1;
  string                message = 2;  // Human-readable; optional.
  repeated FieldError   fields  = 3;  // Populated when code = INVALID_INPUT.
}

// ---- LoginUser --------------------------------------------------------------

message LoginUserRequest {
  string email    = 1;  // required; normalized to lowercase server-side.
  string password = 2;  // required; plaintext over TLS from gateway.
}

message LoginUserResponse {
  oneof result {
    LoginUserSuccess success = 1;
    LoginUserError   error   = 2;
  }
}

message LoginUserSuccess {
  string   access_token          = 1;  // JWT, RS256-signed. See spec §4.5.
  string   refresh_token         = 2;  // opaque, base64url-encoded (43 chars).
  int64    access_expires_at_ms  = 3;  // int64 ms since epoch.
  int64    refresh_expires_at_ms = 4;
  string   user_id               = 5;  // ULID (26-char Crockford base32).
  UserRole role                  = 6;  // reuses existing enum.
}

enum LoginUserErrorCode {
  LOGIN_USER_ERROR_CODE_UNSPECIFIED         = 0;
  LOGIN_USER_ERROR_CODE_INVALID_INPUT       = 1;  // Malformed email format.
  LOGIN_USER_ERROR_CODE_INVALID_CREDENTIALS = 2;  // Wrong email OR wrong password — do NOT distinguish.
  LOGIN_USER_ERROR_CODE_INTERNAL            = 3;
}

message LoginUserError {
  LoginUserErrorCode  code    = 1;
  string              message = 2;   // Human-readable; optional.
  repeated FieldError fields  = 3;   // Populated when code = INVALID_INPUT.
}

// ---- RefreshToken -----------------------------------------------------------

message RefreshTokenRequest {
  string refresh_token = 1;  // opaque; from a prior LoginUser or RefreshToken success.
}

message RefreshTokenResponse {
  oneof result {
    RefreshTokenSuccess success = 1;
    RefreshTokenError   error   = 2;
  }
}

message RefreshTokenSuccess {
  string access_token          = 1;
  string refresh_token         = 2;  // NEW rotated token.
  int64  access_expires_at_ms  = 3;
  int64  refresh_expires_at_ms = 4;
}

enum RefreshTokenErrorCode {
  REFRESH_TOKEN_ERROR_CODE_UNSPECIFIED    = 0;
  REFRESH_TOKEN_ERROR_CODE_INVALID_TOKEN  = 1;  // Not found, revoked, or expired.
  REFRESH_TOKEN_ERROR_CODE_REUSE_DETECTED = 2;  // Rotated token presented again — family invalidated.
  REFRESH_TOKEN_ERROR_CODE_INTERNAL       = 3;
}

message RefreshTokenError {
  RefreshTokenErrorCode code    = 1;
  string                message = 2;
}

// ---- Logout -----------------------------------------------------------------

message LogoutRequest {
  string refresh_token = 1;
}

message LogoutResponse {
  oneof result {
    LogoutSuccess success = 1;
    LogoutError   error   = 2;
  }
}

message LogoutSuccess {}

enum LogoutErrorCode {
  LOGOUT_ERROR_CODE_UNSPECIFIED = 0;
  LOGOUT_ERROR_CODE_INTERNAL    = 1;
}

message LogoutError {
  LogoutErrorCode code    = 1;
  string          message = 2;
}

// ---- GetUserContacts --------------------------------------------------------

message GetUserContactsRequest {
  string user_id = 1;  // ULID (26-char Crockford base32).
}

message GetUserContactsResponse {
  oneof result {
    GetUserContactsSuccess success = 1;
    GetUserContactsError   error   = 2;
  }
}

message GetUserContactsSuccess {
  string user_id = 1;
  string email   = 2;  // Always populated — users.email is NOT NULL.
  string phone   = 3;  // Always populated — users.phone is NOT NULL, E.164.
}

// First NOT_FOUND variant in identity.users.v1 — expected and correct, this is
// the package's first lookup-shaped RPC.
enum GetUserContactsErrorCode {
  GET_USER_CONTACTS_ERROR_CODE_UNSPECIFIED   = 0;
  GET_USER_CONTACTS_ERROR_CODE_INVALID_INPUT = 1;  // user_id empty or not a ULID.
  GET_USER_CONTACTS_ERROR_CODE_NOT_FOUND     = 2;  // No such user.
  GET_USER_CONTACTS_ERROR_CODE_INTERNAL      = 3;
}

message GetUserContactsError {
  GetUserContactsErrorCode code    = 1;
  string                   message = 2;
}
