syntax = "proto3";

package marketplace.orders.v1;

// NOTE ON `identity/users/v1/users.proto`: this is a service package importing another
// domain's service package, which the repo README otherwise forbids. It is imported
// for exactly one type — `FieldError` — which `identity.profiles.v1` and
// `marketplace.listings.v1` already reuse the same way. Recorded as accepted debt.
// Import NOTHING ELSE from identity.*.
import "identity/users/v1/users.proto";              // reuse FieldError — see the note above
import "common/money/v1/money.proto";                // Currency
import "marketplace/reference/v1/reference.proto";   // ProductCategory, QuantityUnit, DeliveryMethod

// OrdersService owns the marketplace/orders bounded context: the order aggregate,
// its immutable listing snapshots, and its lifecycle.
//
// gRPC domain service — no HTTP surface. client-gateway is the only external caller.
// orders-service is in turn the only caller of marketplace.listings.v1
// .GetListingForOrder, exactly once, at order creation.
//
// ---- NO REQUEST MESSAGE IN THIS PACKAGE CARRIES A PARTY ID ------------------
//
// The buyer's / seller's identity is taken from the `x-authenticated-user-id` gRPC
// metadata header on every client RPC, and NEVER from the request body. There is no
// `buyer_id` or `seller_id` request field anywhere in this package and none must be
// added.
//
// This DELIBERATELY DIFFERS from `marketplace.listings.v1`, which sends `seller_id`
// in both the request body and the metadata and rejects a mismatch. A body field
// whose only permitted value is the metadata value is a redundant field whose sole
// function is to be rejected: it cannot carry information, it can only carry a bug,
// and every handler pays for it with a comparison that must never be forgotten.
//
// Do NOT "restore consistency" with marketplace.listings.v1 by adding the id back.
// The divergence is the decision, not an oversight.
//
// `buyer_id` and `seller_id` DO appear on the `Order` RESPONSE message — that is a
// fact about the order being read, not an assertion of who is calling.
service OrdersService {
  // Surface: client — the buyer's identity comes from `x-authenticated-user-id`
  //   metadata ONLY; there is no buyer_id field and one must not be added.
  //   Creates exactly ONE order from ONE listing with a quantity. There is no cart:
  //   see the notes on OrderItem.
  //   This RPC calls marketplace.listings.v1.GetListingForOrder and MUST NOT DEGRADE
  //   when that call fails — see LISTING_UNAVAILABLE below. The call happens exactly
  //   once, at creation, and its answer is frozen onto the order as a snapshot; a
  //   cached, guessed or partial snapshot is an order for the wrong amount, and
  //   because snapshots are never updated it can never be corrected afterwards. When
  //   the call fails, NO ROW IS WRITTEN and the RPC returns LISTING_UNAVAILABLE.
  //
  //   NOTHING DECREMENTS `quantity_available`. That happens in listings-service, on
  //   the `marketplace.orders.confirmed` event, in TASK-48. The counter is an
  //   ADVERTISEMENT, not a reservation ledger: two buyers may both order the last
  //   queen and the seller declines one. The INSUFFICIENT_QUANTITY check below is a
  //   courtesy that races by design. Do NOT add locking, reservations or a
  //   read-modify-write to make it strict.
  rpc CreateOrder(CreateOrderRequest) returns (CreateOrderResponse);

  // Surface: client — party-scoped. The caller must be the order's buyer or seller;
  //   anyone else gets NOT_FOUND, never PERMISSION_DENIED, so the RPC is not an
  //   existence oracle for order ids.
  rpc GetOrder(GetOrderRequest) returns (GetOrderResponse);

  // Surface: client — orders where the caller is the BUYER.
  rpc ListOrdersAsBuyer(ListOrdersAsBuyerRequest) returns (ListOrdersAsBuyerResponse);

  // Surface: client — orders where the caller is the SELLER.
  //   Two RPCs rather than one with a role flag, deliberately: the domain service must
  //   never infer the caller's role. The gateway picks the RPC by which route was hit.
  rpc ListOrdersAsSeller(ListOrdersAsSellerRequest) returns (ListOrdersAsSellerResponse);

  // ---- Lifecycle transitions ------------------------------------------------
  //
  // Every RPC below takes the acting party from `x-authenticated-user-id` metadata and
  // NEVER from the request body — see the package note above. Each one records the
  // transition in `order_status_history` with the actor type it derived there.
  //
  // Three different failures, three different codes, on every transition RPC. They are
  // three distinct facts and none may be folded into another:
  //   * unknown / malformed id, or the caller is not a party to this order
  //       -> NOT_FOUND (the RPC must not be an existence oracle for order ids)
  //   * the caller IS a party, but not the party entitled to this edge
  //       -> FORBIDDEN_TRANSITION
  //   * the edge is not in the transition table for the order's current status
  //       -> INVALID_STATUS_TRANSITION
  // A party who is merely not entitled to an edge must NOT be told the order does not
  // exist: they can already read it through GetOrder, so hiding it would only be a lie
  // to someone who can see the truth.

  // Surface: client — SELLER only. PENDING_CONFIRMATION -> CONFIRMED.
  //   A buyer calling this is a party but the wrong one: FORBIDDEN_TRANSITION.
  rpc ConfirmOrder(ConfirmOrderRequest) returns (ConfirmOrderResponse);

  // Surface: client — SELLER only. PENDING_CONFIRMATION -> REJECTED.
  //   A reason code is mandatory. REJECTED is a separate terminal state from
  //   CANCELLED on purpose: declining a request before any agreement exists costs the
  //   buyer a few days, whereas abandoning a confirmed order in May can cost them the
  //   season. The reject reason slug is stored in `Order.cancellation_reason` with
  //   `Order.cancelled_by` left UNSPECIFIED — nobody cancelled a rejected order.
  rpc RejectOrder(RejectOrderRequest) returns (RejectOrderResponse);

  // Surface: client — BUYER or SELLER. -> CANCELLED.
  //   Sets `Order.cancelled_by` from the AUTHENTICATED IDENTITY in metadata, never
  //   from the request body. That is precisely why the request carries no actor field
  //   and one must not be added: a body field that decides who is blamed is a field a
  //   client controls.
  rpc CancelOrder(CancelOrderRequest) returns (CancelOrderResponse);

  // Surface: client — SELLER only. CONFIRMED -> READY.
  rpc MarkReady(MarkReadyRequest) returns (MarkReadyResponse);

  // Surface: client — SELLER only. READY -> SHIPPED. Carries the TTN, free text in MVP.
  rpc MarkShipped(MarkShippedRequest) returns (MarkShippedResponse);

  // Surface: client — BUYER only. The buyer has the goods.
  //   ONE RPC COVERS BOTH courier delivery and self-pickup collection, because it is
  //   ONE FACT: the buyer is holding what they bought. Do NOT split this into
  //   ConfirmDelivery and ConfirmPickup — the delivery method already distinguishes
  //   the two, and a second RPC would only give a client a way to assert the wrong one.
  //   For a LIVE order this opens the observation window; for GOODS it completes.
  rpc ConfirmHandover(ConfirmHandoverRequest) returns (ConfirmHandoverResponse);

  // Surface: client — BUYER only. OBSERVATION -> COMPLETED.
  //   The buyer's EARLY EXIT from an observation window that would otherwise close on
  //   its own at T3. Nothing is lost by not calling it — the deadline sweeper reaches
  //   the same state as ActorType SYSTEM — but for the wedge category it is the whole
  //   point: a buyer whose queens ARE laying should not have to sit out fourteen days
  //   to close a sale that already went right.
  //
  //   A SELLER CALLING THIS IS FORBIDDEN_TRANSITION, always and in every status. A
  //   seller must never be able to complete their own sale; the timer is what closes
  //   the window when the buyer stays silent, and that timer is the seller's only
  //   route to COMPLETED. Do not add a seller edge here, and do not let the sweeper
  //   call this RPC — the sweeper writes ActorType SYSTEM directly.
  //
  //   This RPC is NOT how the zero-window paths complete. For FULFILMENT_CLASS_GOODS
  //   the observation window is zero days and ConfirmHandover completes the order
  //   outright, self-pickup included; there is no OBSERVATION state to exit. Calling
  //   this on such an order is INVALID_STATUS_TRANSITION, not a second way to do the
  //   same thing.
  rpc CompleteOrder(CompleteOrderRequest) returns (CompleteOrderResponse);

  // Surface: client — BUYER only. OBSERVATION -> REPLACEMENT_REQUESTED.
  //   The observation window is per ORDER — one delivery is one clock — but claims are
  //   per ITEM and per QUANTITY. The window must still be open; a late claim is
  //   WINDOW_CLOSED, not INVALID_STATUS_TRANSITION.
  rpc RequestReplacement(RequestReplacementRequest) returns (RequestReplacementResponse);

  // Surface: client — SELLER only. Answers a pending claim.
  //   `accept = true` spawns a CHILD order, returned in `child_order`; the parent
  //   becomes CLOSED_REPLACED. `accept = false` closes the parent as CLOSED_UNRESOLVED
  //   with reason SELLER_REFUSED and `child_order` is absent. A seller who never
  //   answers within T4 produces the same state with reason SELLER_SILENT — the same
  //   ending, deliberately recorded as a different reason.
  rpc RespondToReplacement(RespondToReplacementRequest) returns (RespondToReplacementResponse);

  // Surface: client — BUYER only. REPLACEMENT_REQUESTED -> COMPLETED.
  //   The buyer takes the claim back; the order completes as if it had never been made.
  rpc WithdrawReplacement(WithdrawReplacementRequest) returns (WithdrawReplacementResponse);

  // Surface: client — BUYER only. SHIPPED -> CLOSED_UNRESOLVED, reason NOT_DELIVERED.
  //   The parcel never arrived, so there is nothing to observe and no remedy to run.
  rpc ReportNonDelivery(ReportNonDeliveryRequest) returns (ReportNonDeliveryResponse);

  // Surface: client — BUYER only. Called BEFORE RequestReplacement.
  //   Returns an opaque storage key that the buyer then passes in
  //   `ReplacementClaimInput.evidence_keys`. Evidence goes to the PRIVATE storage root
  //   and has no public URL — a claim photograph is not catalogue content and no HTTP
  //   handler serves it.
  //
  //   THIS IS THE FIRST INLINE BINARY PAYLOAD IN THIS PACKAGE: up to 5 MiB of `bytes`
  //   in the request. client-gateway's orders client MUST raise its gRPC encoder /
  //   decoder message-size limit for it — the tonic default of 4 MiB is below the
  //   documented 5 MiB tier and would reject a legal upload as a transport error.
  rpc UploadClaimEvidence(UploadClaimEvidenceRequest) returns (UploadClaimEvidenceResponse);

  // Surface: internal — NO gateway route exposes this in this release. It feeds the
  //   public seller-statistics rule and is called service-to-service only, which is
  //   also why it is the one RPC here that takes a party id in its body: the caller is
  //   another service asking about a third party, not a user asserting who they are.
  rpc GetSellerOrderStats(GetSellerOrderStatsRequest) returns (GetSellerOrderStatsResponse);

  // Surface: internal — required by platform convention.
  rpc Ping(PingRequest) returns (PingResponse);
}

// ---- THERE IS NO `OpenDispute` RPC, AND THERE MUST NEVER BE ONE -------------
//
// Architecture §9.1 lists one. TASK-66 removed arbitration from the MVP entirely:
// there is no dispute aggregate, no moderation queue, and nothing on this platform
// that adjudicates. Do NOT add `OpenDispute`, a `DISPUTE_OPEN` status, or any
// dispute / arbitration / moderation message — not even a placeholder returning
// UNIMPLEMENTED. An RPC that exists and refuses is strictly worse than an absent one:
// clients build against a declared method, generated stubs make it look supported,
// and the failure surfaces at runtime in a user's hands instead of at compile time in
// a developer's editor. An absent RPC fails loudly at the call site, which is where it
// should fail.
//
// What this package records instead is the SELLER's replacement commitment
// (`RequestReplacement` / `RespondToReplacement`). When the seller refuses it or never
// answers, the order ends in CLOSED_UNRESOLVED and stays there; that state does not
// auto-resolve in anyone's favour after any delay. Nothing and nobody steps in after
// it.
//
// ---- `CompleteOrder` EXISTS, AND IT IS BUYER-ONLY ---------------------------
//
// 0.10.0 carried a comment here asserting the opposite — that no such RPC existed. It
// was wrong. The normative transition table in the lifecycle spec lists
// `OBSERVATION -> COMPLETED | buyer early, or system T3` and calls it the default
// outcome; the spec's own RPC table simply omitted the method. Constraining the ACTOR
// of an RPC is only meaningful for an RPC that exists, so "buyer-only" was always a
// statement that it does. The edge is real and is now declared above.
//
// COMPLETION IS BUYER-DRIVEN OR TIME-DRIVEN, NEVER SELLER-DRIVEN. That much of the old
// comment was right and still holds. A seller MUST NOT be able to complete their own
// sale, in any status, by any route — that is exactly what the deadline sweeper is for.
// When the buyer says nothing, the sweeper closes the observation window at T3 and
// records ActorType SYSTEM. That is the seller's only path to COMPLETED, and no RPC in
// this package accepts a seller as the completing actor. `CompleteOrder` is the BUYER's
// early exit from a window that would otherwise close on its own; it changes WHEN the
// order completes, never WHO may complete it.
//
// Completion also arrives without this RPC on the paths that never open a window: for
// FULFILMENT_CLASS_GOODS the observation window is zero days and `ConfirmHandover`
// completes the order directly, self-pickup included. And a buyer who has filed a claim
// completes by `WithdrawReplacement`, not by this RPC.

message PingRequest {}
message PingResponse { int64 server_time_ms = 1; }

// Do not redefine FieldError — reuse `identity.users.v1.FieldError`.
//
// Do not define a `Money` message either. `common/money/v1/money.proto` states
// explicitly that an amount and its currency travel as two sibling fields on the
// owning message; introducing `Money{amount,currency}` later would be a wire break on
// every carrier, so it is never added speculatively — including here.

// ---- Enums local to this package --------------------------------------------

// The complete order lifecycle. Only PENDING_CONFIRMATION is reachable in this
// release — every transition out of it ships with TASK-48. The full set is declared
// now, not a single value, because the `orders.status` column is TEXT and already
// accepts all twelve slugs; a partial enum would force the row->proto mapper to fail
// on values the database legitimately permits.
enum OrderStatus {
  ORDER_STATUS_UNSPECIFIED           = 0;  // Never emitted by the service.
  ORDER_STATUS_PENDING_CONFIRMATION  = 1;
  ORDER_STATUS_CONFIRMED             = 2;
  ORDER_STATUS_READY                 = 3;
  ORDER_STATUS_SHIPPED               = 4;
  ORDER_STATUS_OBSERVATION           = 5;
  ORDER_STATUS_REPLACEMENT_REQUESTED = 6;
  ORDER_STATUS_COMPLETED             = 7;
  ORDER_STATUS_CLOSED_REPLACED       = 8;
  ORDER_STATUS_CLOSED_UNRESOLVED     = 9;
  ORDER_STATUS_REJECTED              = 10;
  ORDER_STATUS_CANCELLED             = 11;
  ORDER_STATUS_EXPIRED               = 12;
}

// Derived ONCE at creation from the item's category via the seeded
// `orders_service.category_policies` table, then frozen onto the order. Never
// recomputed. TASK-48's entire guarantee branch keys off the snapshotted
// observation_window_days, never the policy table.
enum FulfilmentClass {
  FULFILMENT_CLASS_UNSPECIFIED = 0;
  FULFILMENT_CLASS_LIVE        = 1;  // queen_bee, bee_package, bee_colony -> 14-day window
  FULFILMENT_CLASS_GOODS       = 2;  // everything else -> 0-day window
}

// Snapshotted and INFORMATIONAL. The platform holds no money (TASK-70) and nothing
// in this release or in TASK-48 reads this field. It exists so that it is present,
// populated and understood by the time it becomes load-bearing.
//
// COD_NOVA_POSHTA IS DELIBERATELY ABSENT AND MUST NOT BE ADDED. Nova Poshta
// prohibits sending insects, so offering cash-on-delivery through that carrier would
// route the wedge category (queens) into a carrier that forbids it — the same reason
// NOVA_POSHTA is absent from marketplace.reference.v1.DeliveryMethod (TASK-67).
enum PaymentMethod {
  PAYMENT_METHOD_UNSPECIFIED          = 0;
  PAYMENT_METHOD_CASH_ON_PICKUP       = 1;  // paid in person at handover; pairs with SELF_PICKUP
  PAYMENT_METHOD_CARD_TO_CARD_OFFLINE = 2;  // arranged between the parties; no platform visibility or recourse
  PAYMENT_METHOD_PREPAY_OFFLINE       = 3;  // buyer paid in advance by agreement; same absence of recourse
  PAYMENT_METHOD_POSTAL_COD           = 4;  // Ukrposhta pislyaplata. UNVERIFIED: fees, limits and
                                            // applicability to the live-bee tariff were never researched.
}

enum PaymentStatus {
  PAYMENT_STATUS_UNSPECIFIED = 0;
  PAYMENT_STATUS_UNPAID      = 1;  // the only value this release ever writes
  PAYMENT_STATUS_PAID        = 2;
}

// Who performed a transition. Mirrors the actor_type CHECK on
// orders_service.order_status_history and the cancelled_by CHECK on orders.
enum ActorType {
  ACTOR_TYPE_UNSPECIFIED = 0;
  ACTOR_TYPE_BUYER       = 1;
  ACTOR_TYPE_SELLER      = 2;
  ACTOR_TYPE_SYSTEM      = 3;  // the deadline sweeper; never a human
}

// Why an order ended with no remedy. CLOSED_UNRESOLVED is terminal and does NOT
// auto-resolve in anyone's favour after any delay — an order that ended without a
// remedy must look like one. The reason is kept OUT of `status` so the machine reasons
// about one edge while the attribution stays queryable.
enum UnresolvedReason {
  UNRESOLVED_REASON_UNSPECIFIED       = 0;
  UNRESOLVED_REASON_NOT_DELIVERED     = 1;  // buyer reported the parcel never arrived
  UNRESOLVED_REASON_SELLER_REFUSED    = 2;  // seller rejected the replacement claim
  UNRESOLVED_REASON_SELLER_SILENT     = 3;  // seller never answered within T4
  UNRESOLVED_REASON_GENERATION_CAPPED = 4;  // claim filed on an order that was already a replacement
}
// SELLER_REFUSED and SELLER_SILENT produce the SAME state and MUST remain two distinct
// values. The difference between a seller who argued and a seller who ignored the buyer
// is exactly the evidence that matters later; collapsing them destroys it irrecoverably
// and nothing reconstructs it afterwards.

// What the buyer is claiming. The guarantee this platform records is the SELLER's
// commitment that a live queen begins laying within the observation window — nothing
// else. Wrong breed, short count and dead-on-arrival are deliberately ABSENT: with no
// arbitration there is no aggregate to hold them, and offering a claim code that can
// only ever end in CLOSED_UNRESOLVED would be an interface that invites a complaint and
// then does nothing. Do not add a catch-all OTHER value for the same reason.
enum ClaimReasonCode {
  CLAIM_REASON_CODE_UNSPECIFIED              = 0;
  CLAIM_REASON_CODE_QUEEN_NOT_LAYING         = 1;
  CLAIM_REASON_CODE_COLONY_DID_NOT_ESTABLISH = 2;  // bee package / colony analogue
}

enum ReplacementClaimStatus {
  REPLACEMENT_CLAIM_STATUS_UNSPECIFIED = 0;
  REPLACEMENT_CLAIM_STATUS_REQUESTED   = 1;
  REPLACEMENT_CLAIM_STATUS_ACCEPTED    = 2;
  REPLACEMENT_CLAIM_STATUS_REJECTED    = 3;
  REPLACEMENT_CLAIM_STATUS_WITHDRAWN   = 4;
}

// Seller declines a request before any agreement exists. REJECTED is a separate state
// from CANCELLED on purpose: declining a request costs the buyer a few days, whereas
// abandoning a confirmed order in May can cost them the season.
enum RejectReasonCode {
  REJECT_REASON_CODE_UNSPECIFIED           = 0;
  REJECT_REASON_CODE_OUT_OF_STOCK          = 1;
  REJECT_REASON_CODE_CANNOT_FULFIL_BY_DATE = 2;
  REJECT_REASON_CODE_DELIVERY_NOT_POSSIBLE = 3;
  REJECT_REASON_CODE_BUYER_UNREACHABLE     = 4;
  REJECT_REASON_CODE_OTHER                 = 5;
}

enum CancellationReasonCode {
  CANCELLATION_REASON_CODE_UNSPECIFIED         = 0;
  CANCELLATION_REASON_CODE_BUYER_CHANGED_MIND  = 1;
  CANCELLATION_REASON_CODE_SELLER_BATCH_FAILED = 2;  // queens did not mate; first-class, not an excuse
  CANCELLATION_REASON_CODE_TERMS_NOT_AGREED    = 3;
  CANCELLATION_REASON_CODE_OTHER               = 4;
}

// ---- Domain messages --------------------------------------------------------

// One row of the order. Exactly ONE is written per order in this release.
//
// `order_items` is NOT a shopping basket — there is no cart in this product despite
// the feature name. The grain exists for GUARANTEE granularity: a buyer ordering ten
// queens and five packages from one breeder is one shipment and one 14-day window,
// and TASK-48's replacement claim must attribute to a specific line. The grain is
// needed even when the count is one.
//
// Every *_snapshot field is frozen at creation and NEVER updated — not by a later
// listing edit, not by a correction, not by an admin. A guarantee claim is
// adjudicated against what was promised. If a snapshot is wrong the order is
// cancelled and a new one placed.
message OrderItem {
  string                                   order_item_id            = 1;   // ULID
  string                                   listing_id               = 2;   // soft reference; no FK, different service
  int32                                    quantity                 = 3;   // >= 1
  string                                   title_snapshot           = 4;
  marketplace.reference.v1.ProductCategory category_snapshot        = 5;
  int64                                    unit_price_amount        = 6;   // integer minor units (kopiyky)
  common.money.v1.Currency                 unit_price_currency      = 7;
  marketplace.reference.v1.QuantityUnit    quantity_unit            = 8;
  string                                   attributes_snapshot_json = 9;   // JSON object, "{}" when empty
  int64                                    created_at_ms            = 10;
}

// The order aggregate as read by either party.
//
// Fields 1..17 are the 0.9.0 creation-and-read surface. Fields 18..30 are the lifecycle
// surface, appended here: they were held back from 0.9.0 only because nothing could
// then populate them, and appending new numbers to an existing message is not a wire
// break. Nothing in 1..17 changed.
//
// Caller-relative facts do NOT belong on this message — `Order` also appears in list
// responses, where a field about the caller would be misleading. `contacts_released`,
// the claim list and `buyer_cancellation_count` therefore live on GetOrderSuccess.
message Order {
  string                                  order_id                = 1;   // ULID
  string                                  buyer_id                = 2;   // ULID
  string                                  seller_id               = 3;   // ULID
  OrderStatus                             status                  = 4;
  FulfilmentClass                         fulfilment_class        = 5;
  // EXCLUDES shipping. The recipient pays the carrier at the counter by standing
  // decision, so the platform neither knows nor collects it. There is deliberately
  // no shipping_cost field: a value that is always absent teaches the reader that
  // the number exists somewhere, which is exactly wrong.
  int64                                   total_amount            = 6;   // minor units; unit_price_amount * quantity
  common.money.v1.Currency                total_currency          = 7;
  PaymentMethod                           payment_method          = 8;
  PaymentStatus                           payment_status          = 9;
  marketplace.reference.v1.DeliveryMethod delivery_method         = 10;
  optional string                         delivery_address        = 11;  // free text; not normalised in MVP
  optional string                         readiness_date          = 12;  // YYYY-MM-DD, snapshotted from the listing.
                                                                         // A calendar date, NOT an instant — do not
                                                                         // "fix" this to int64 ms.
  int32                                   observation_window_days = 13;  // snapshot of category policy
  optional string                         buyer_note              = 14;  // <= 500 chars
  repeated OrderItem                      items                   = 15;  // exactly one in this release
  int64                                   created_at_ms           = 16;
  int64                                   updated_at_ms           = 17;

  // ---- Lifecycle surface (appended; 1..17 above are untouched) ---------------
  //
  // Every instant here is epoch MILLISECONDS, per house rule. `readiness_date` above
  // stays a YYYY-MM-DD calendar date and is not one of these.
  optional int64   confirmed_at_ms          = 18;
  optional int64   ready_at_ms              = 19;
  optional int64   shipped_at_ms            = 20;
  optional int64   delivered_at_ms          = 21;  // also the collection instant for self-pickup
  optional int64   observation_ends_at_ms   = 22;
  optional int64   completed_at_ms          = 23;
  optional string  tracking_number          = 24;  // TTN; free text in MVP
  // UNSPECIFIED when the order was not cancelled. Derived by the service from the
  // authenticated identity of whoever called CancelOrder — never from a request body.
  ActorType        cancelled_by             = 25;
  // Wire slug of CancellationReasonCode OR RejectReasonCode.
  //
  // A REJECTED order stores the SELLER'S REJECT REASON slug here with `cancelled_by`
  // left UNSPECIFIED. The schema is frozen for this run and has no separate
  // reject-reason column, and a rejection reason is the same kind of fact as a
  // cancellation reason. Nobody cancelled a rejected order, so `cancelled_by` must stay
  // unset — read `status` to know which enum the slug came from.
  optional string  cancellation_reason      = 26;
  // UNSPECIFIED unless status is CLOSED_UNRESOLVED. Kept out of `status` so the state
  // machine reasons about one edge while the attribution stays queryable.
  UnresolvedReason unresolved_reason        = 27;
  optional string  replacement_for_order_id = 28;  // set on a child order only
  int32            replacement_generation   = 29;  // 0 for an original order, 1 for a replacement child
  optional int64   next_deadline_at_ms      = 30;  // the single pending deadline, if any
}

// One claim line. The observation window is per ORDER (one delivery is one clock) but a
// claim is per ITEM and per QUANTITY: if three of ten queens never started laying, the
// remedy concerns three queens on one line.
//
// The commitment being claimed against is the SELLER's. This message records what the
// buyer reported and what the seller answered; it does not record an adjudication,
// because nothing here adjudicates.
message ReplacementClaim {
  string                 claim_id         = 1;   // ULID
  string                 order_id         = 2;
  string                 order_item_id    = 3;
  int32                  quantity_claimed = 4;   // >= 1, <= the item's quantity
  ClaimReasonCode        reason_code      = 5;
  optional string        description      = 6;   // <= 1000 chars, free text
  // OPAQUE PRIVATE-STORAGE KEYS, never public URLs. A claim photograph is not catalogue
  // content and there is no HTTP handler that serves it. Keys come from
  // UploadClaimEvidence.
  repeated string        evidence_keys    = 7;
  ReplacementClaimStatus status           = 8;
  optional int64         resolved_at_ms   = 9;
  int64                  created_at_ms    = 10;
}

// What the buyer submits inside RequestReplacement. Separate from ReplacementClaim
// because the service assigns claim_id, order_id, status and the timestamps.
message ReplacementClaimInput {
  string          order_item_id    = 1;
  int32           quantity_claimed = 2;
  ClaimReasonCode reason_code      = 3;
  optional string description      = 4;
  repeated string evidence_keys    = 5;  // keys previously returned by UploadClaimEvidence
}

// ---- CreateOrder ------------------------------------------------------------

message CreateOrderRequest {
  string                                  listing_id       = 1;
  int32                                   quantity         = 2;  // >= 1
  marketplace.reference.v1.DeliveryMethod delivery_method  = 3;  // must be one the listing offers
  optional string                         delivery_address = 4;
  PaymentMethod                           payment_method   = 5;
  // Client-generated ULID. `(buyer_id, idempotency_key)` is unique; a replay returns
  // the EXISTING order rather than creating a second one. A mobile client on a flaky
  // connection retries a timed-out request, and the thing being created is an
  // agreement a human then has to decline — a duplicate here is a second obligation
  // for the seller, not merely duplicate data. Absent key = no protection, and that
  // is the client's choice.
  optional string                         idempotency_key  = 6;
  optional string                         buyer_note       = 7;  // <= 500 chars
}

message CreateOrderResponse {
  oneof result {
    CreateOrderSuccess success = 1;
    CreateOrderError   error   = 2;
  }
}

message CreateOrderSuccess { Order order = 1; }

enum CreateOrderErrorCode {
  CREATE_ORDER_ERROR_CODE_UNSPECIFIED           = 0;
  CREATE_ORDER_ERROR_CODE_INVALID_INPUT         = 1;
  // The listing id is unknown, OR the listing is in a status the buyer must not even
  // learn exists: DRAFT, CLOSED, ARCHIVED, BLOCKED. Do not leak that a blocked
  // listing exists.
  CREATE_ORDER_ERROR_CODE_NOT_FOUND             = 2;
  // The listing exists and is publicly visible, but is PAUSED — the seller has
  // temporarily stopped selling it.
  CREATE_ORDER_ERROR_CODE_LISTING_NOT_AVAILABLE = 3;
  // We could not ASK. listings-service was unreachable, timed out, or answered
  // INTERNAL. NO ROW IS WRITTEN.
  //
  // This RPC MUST NOT DEGRADE. Everything else on this platform does: a missing trust
  // block still renders a listing, missing badges still render a search page, missing
  // contacts still render a profile. This call does not, and the instinct after those
  // three will be to degrade here too. There is no safe fallback — an order created
  // from a guessed or cached price is a contract for the wrong amount, and it is a
  // contract the platform cannot correct afterwards, because snapshots are never
  // updated.
  //
  // LISTING_NOT_AVAILABLE and LISTING_UNAVAILABLE are DIFFERENT FACTS: "the listing is
  // paused" versus "we could not ask". Two codes, not one — the client's retry
  // behaviour differs (never retry the first; retry the second).
  CREATE_ORDER_ERROR_CODE_LISTING_UNAVAILABLE   = 4;
  // The authenticated buyer is the listing's seller.
  CREATE_ORDER_ERROR_CODE_SELF_DEALING          = 5;
  // quantity exceeds the listing's quantity_available, when that counter is present.
  // A courtesy check that races by design — see the note on CreateOrder: the counter
  // is an advertisement, not a reservation ledger, and nothing here decrements it.
  CREATE_ORDER_ERROR_CODE_INSUFFICIENT_QUANTITY = 6;
  // Includes: the snapshotted category has no row in category_policies. That is an
  // INTERNAL error at creation and NEVER a silent default of zero — a silent zero
  // sells a live queen with no guarantee, discovered fourteen days too late.
  CREATE_ORDER_ERROR_CODE_INTERNAL              = 7;
}

message CreateOrderError {
  CreateOrderErrorCode                  code    = 1;
  string                                message = 2;
  repeated identity.users.v1.FieldError fields  = 3;
}

// ---- GetOrder ---------------------------------------------------------------

message GetOrderRequest { string order_id = 1; }

message GetOrderResponse {
  oneof result {
    GetOrderSuccess success = 1;
    GetOrderError   error   = 2;
  }
}

message GetOrderSuccess {
  Order order             = 1;
  // Whether the CALLER is entitled to the counterparty's phone and email, computed
  // from the order status and which party the caller is. Deliberately on the response
  // envelope and not on `Order`: it is a fact about the caller, not about the order,
  // and `Order` also appears in list responses where a caller-relative field would be
  // misleading.
  //
  // This is a TRANSACTIONAL policy and is NOT the profile's `show_contact_*` display
  // toggles. Those govern whether a stranger browsing a public profile sees a phone
  // number; a counterparty to a confirmed order is not a stranger browsing, and a
  // display preference must not silently make a transaction impossible. Two different
  // questions, two different answers — do NOT route this through profile-service.
  //
  // orders-service computes this flag and calls NOBODY. client-gateway executes the
  // release by calling identity.users.v1.GetUserContacts.
  //
  // In this release the flag is ALWAYS false, because nothing can reach CONFIRMED
  // until TASK-48. Implement it anyway; TASK-48 makes it true.
  bool  contacts_released = 2;

  // Claims filed against this order, newest last. On the response envelope rather than
  // on `Order` so that list responses stay light — a list of thirty orders must not
  // drag every claim line and evidence key with it.
  repeated ReplacementClaim claims = 3;

  // How many orders this BUYER has cancelled. POPULATED ONLY WHEN THE CALLER IS THE
  // SELLER; absent otherwise. It exists so a seller can see the buyer's cancellation
  // history before confirming a booking — the only consequence available on a platform
  // that holds no money. Caller-relative exactly like `contacts_released`, which is why
  // it belongs here and not on `Order`.
  optional int32 buyer_cancellation_count = 4;
}

enum GetOrderErrorCode {
  GET_ORDER_ERROR_CODE_UNSPECIFIED = 0;
  // Unknown id, a malformed (non-ULID) id, OR the caller is neither the buyer nor the
  // seller. All three collapse to NOT_FOUND on purpose — a distinct "forbidden" answer
  // would turn this RPC into an existence oracle for order ids.
  GET_ORDER_ERROR_CODE_NOT_FOUND   = 1;
  GET_ORDER_ERROR_CODE_INTERNAL    = 2;
}

// No `fields` here — house rule: `repeated FieldError fields` appears only on errors
// that can return INVALID_INPUT, and this one cannot.
message GetOrderError { GetOrderErrorCode code = 1; string message = 2; }

// ---- ListOrdersAsBuyer ------------------------------------------------------
//
// Owner-scoped list, so this uses the limit/offset + total pagination form of
// `marketplace.listings.v1.ListOwnListings`, NOT the public catalogue's opaque cursor
// form. A cursor exists to keep a deep public feed stable and cheap; these lists are
// scoped to one party's own orders, are small and bounded, and a client that wants
// page 4 should be able to ask for it.

message ListOrdersAsBuyerRequest {
  repeated OrderStatus statuses = 1;  // empty = every status
  int32                limit    = 2;  // 0 -> service default 20; max 100
  int32                offset   = 3;  // >= 0
}

message ListOrdersAsBuyerResponse {
  oneof result {
    ListOrdersAsBuyerSuccess success = 1;
    ListOrdersAsBuyerError   error   = 2;
  }
}

message ListOrdersAsBuyerSuccess {
  repeated Order orders = 1;  // created_at DESC
  int32          total  = 2;  // total matching rows, ignoring limit/offset
}

enum ListOrdersAsBuyerErrorCode {
  LIST_ORDERS_AS_BUYER_ERROR_CODE_UNSPECIFIED   = 0;
  LIST_ORDERS_AS_BUYER_ERROR_CODE_INVALID_INPUT = 1;
  LIST_ORDERS_AS_BUYER_ERROR_CODE_INTERNAL      = 2;
}

message ListOrdersAsBuyerError {
  ListOrdersAsBuyerErrorCode            code    = 1;
  string                                message = 2;
  repeated identity.users.v1.FieldError fields  = 3;
}

// ---- ListOrdersAsSeller -----------------------------------------------------
//
// The buyer-side shapes above, repeated rather than shared. Do NOT collapse the two
// into one request/response pair with a `role` field: separate types are exactly what
// keeps a role flag from reappearing, and a role flag would put the decision of whose
// orders to return into the request body, where a client controls it.

message ListOrdersAsSellerRequest {
  repeated OrderStatus statuses = 1;  // empty = every status
  int32                limit    = 2;  // 0 -> service default 20; max 100
  int32                offset   = 3;  // >= 0
}

message ListOrdersAsSellerResponse {
  oneof result {
    ListOrdersAsSellerSuccess success = 1;
    ListOrdersAsSellerError   error   = 2;
  }
}

message ListOrdersAsSellerSuccess {
  repeated Order orders = 1;  // created_at DESC
  int32          total  = 2;  // total matching rows, ignoring limit/offset
}

enum ListOrdersAsSellerErrorCode {
  LIST_ORDERS_AS_SELLER_ERROR_CODE_UNSPECIFIED   = 0;
  LIST_ORDERS_AS_SELLER_ERROR_CODE_INVALID_INPUT = 1;
  LIST_ORDERS_AS_SELLER_ERROR_CODE_INTERNAL      = 2;
}

message ListOrdersAsSellerError {
  ListOrdersAsSellerErrorCode           code    = 1;
  string                                message = 2;
  repeated identity.users.v1.FieldError fields  = 3;
}

// ---- Lifecycle transitions: requests, responses and error codes -------------
//
// The eleven transition RPCs share one error SHAPE, written out per RPC rather than
// hoisted into a shared enum, per house style: a shared enum would drag every RPC's
// codes into every other RPC's surface, and the per-RPC additions below show why the
// sets are not actually the same.
//
// NONE of these requests carries a buyer_id, seller_id or actor field. See the package
// note at the top of this file — the acting party is the authenticated caller in
// `x-authenticated-user-id` metadata, and that is not negotiable across twelve request
// messages written in a row.

// ---- ConfirmOrder -----------------------------------------------------------

message ConfirmOrderRequest { string order_id = 1; }

message ConfirmOrderResponse {
  oneof result {
    ConfirmOrderSuccess success = 1;
    ConfirmOrderError   error   = 2;
  }
}

message ConfirmOrderSuccess { Order order = 1; }

enum ConfirmOrderErrorCode {
  CONFIRM_ORDER_ERROR_CODE_UNSPECIFIED               = 0;
  // Unknown order id, a malformed (non-ULID) id, OR the caller is neither the buyer nor
  // the seller. All collapse to NOT_FOUND so the RPC is not an existence oracle.
  CONFIRM_ORDER_ERROR_CODE_NOT_FOUND                 = 1;
  // The caller IS a party to this order, but not the party entitled to this edge — e.g.
  // a buyer calling ConfirmOrder. A legitimate party, just not the right one. This is
  // NOT NOT_FOUND: hiding it would be lying to someone who can already see the order.
  CONFIRM_ORDER_ERROR_CODE_FORBIDDEN_TRANSITION      = 2;
  // The edge is not in the transition table for the order's current status. A third and
  // separate fact from the two above: right caller, wrong moment.
  CONFIRM_ORDER_ERROR_CODE_INVALID_STATUS_TRANSITION = 3;
  CONFIRM_ORDER_ERROR_CODE_INVALID_INPUT             = 4;
  CONFIRM_ORDER_ERROR_CODE_INTERNAL                  = 5;
}

message ConfirmOrderError {
  ConfirmOrderErrorCode                 code    = 1;
  string                                message = 2;
  repeated identity.users.v1.FieldError fields  = 3;
}

// ---- RejectOrder ------------------------------------------------------------

message RejectOrderRequest {
  string           order_id    = 1;
  RejectReasonCode reason_code = 2;  // mandatory; a bare refusal tells the buyer nothing
  optional string  reason_note = 3;  // <= 500 chars, free text
}

message RejectOrderResponse {
  oneof result {
    RejectOrderSuccess success = 1;
    RejectOrderError   error   = 2;
  }
}

// The returned order has status REJECTED, `cancellation_reason` set to the reject
// reason slug, and `cancelled_by` UNSPECIFIED — nobody cancelled a rejected order.
message RejectOrderSuccess { Order order = 1; }

enum RejectOrderErrorCode {
  REJECT_ORDER_ERROR_CODE_UNSPECIFIED               = 0;
  REJECT_ORDER_ERROR_CODE_NOT_FOUND                 = 1;  // unknown/malformed id, or caller is not a party
  REJECT_ORDER_ERROR_CODE_FORBIDDEN_TRANSITION      = 2;  // a party, but not the one entitled to this edge
  REJECT_ORDER_ERROR_CODE_INVALID_STATUS_TRANSITION = 3;  // edge absent from the table for this status
  REJECT_ORDER_ERROR_CODE_INVALID_INPUT             = 4;
  REJECT_ORDER_ERROR_CODE_INTERNAL                  = 5;
}

message RejectOrderError {
  RejectOrderErrorCode                  code    = 1;
  string                                message = 2;
  repeated identity.users.v1.FieldError fields  = 3;
}

// ---- CancelOrder ------------------------------------------------------------

// Either party may call this, and there is deliberately NO actor field: the service
// derives `Order.cancelled_by` from the authenticated identity in metadata. A body
// field naming who cancelled would let a client attribute its own cancellation to the
// other party.
message CancelOrderRequest {
  string                 order_id    = 1;
  CancellationReasonCode reason_code = 2;
  optional string        reason_note = 3;  // <= 500 chars, free text
}

message CancelOrderResponse {
  oneof result {
    CancelOrderSuccess success = 1;
    CancelOrderError   error   = 2;
  }
}

message CancelOrderSuccess { Order order = 1; }

enum CancelOrderErrorCode {
  CANCEL_ORDER_ERROR_CODE_UNSPECIFIED               = 0;
  CANCEL_ORDER_ERROR_CODE_NOT_FOUND                 = 1;  // unknown/malformed id, or caller is not a party
  // Reachable even though both parties may cancel: a reason code restricted to the
  // other side (SELLER_BATCH_FAILED from a buyer) is the wrong party for this edge.
  CANCEL_ORDER_ERROR_CODE_FORBIDDEN_TRANSITION      = 2;
  CANCEL_ORDER_ERROR_CODE_INVALID_STATUS_TRANSITION = 3;
  CANCEL_ORDER_ERROR_CODE_INVALID_INPUT             = 4;
  CANCEL_ORDER_ERROR_CODE_INTERNAL                  = 5;
}

message CancelOrderError {
  CancelOrderErrorCode                  code    = 1;
  string                                message = 2;
  repeated identity.users.v1.FieldError fields  = 3;
}

// ---- MarkReady --------------------------------------------------------------

message MarkReadyRequest { string order_id = 1; }

message MarkReadyResponse {
  oneof result {
    MarkReadySuccess success = 1;
    MarkReadyError   error   = 2;
  }
}

message MarkReadySuccess { Order order = 1; }

enum MarkReadyErrorCode {
  MARK_READY_ERROR_CODE_UNSPECIFIED               = 0;
  MARK_READY_ERROR_CODE_NOT_FOUND                 = 1;  // unknown/malformed id, or caller is not a party
  MARK_READY_ERROR_CODE_FORBIDDEN_TRANSITION      = 2;  // a party, but not the one entitled to this edge
  MARK_READY_ERROR_CODE_INVALID_STATUS_TRANSITION = 3;  // edge absent from the table for this status
  MARK_READY_ERROR_CODE_INVALID_INPUT             = 4;
  MARK_READY_ERROR_CODE_INTERNAL                  = 5;
}

message MarkReadyError {
  MarkReadyErrorCode                    code    = 1;
  string                                message = 2;
  repeated identity.users.v1.FieldError fields  = 3;
}

// ---- MarkShipped ------------------------------------------------------------

message MarkShippedRequest {
  string          order_id        = 1;
  optional string tracking_number = 2;  // TTN; free text in MVP, never validated against a carrier
}

message MarkShippedResponse {
  oneof result {
    MarkShippedSuccess success = 1;
    MarkShippedError   error   = 2;
  }
}

message MarkShippedSuccess { Order order = 1; }

enum MarkShippedErrorCode {
  MARK_SHIPPED_ERROR_CODE_UNSPECIFIED               = 0;
  MARK_SHIPPED_ERROR_CODE_NOT_FOUND                 = 1;  // unknown/malformed id, or caller is not a party
  MARK_SHIPPED_ERROR_CODE_FORBIDDEN_TRANSITION      = 2;  // a party, but not the one entitled to this edge
  MARK_SHIPPED_ERROR_CODE_INVALID_STATUS_TRANSITION = 3;  // edge absent from the table for this status
  MARK_SHIPPED_ERROR_CODE_INVALID_INPUT             = 4;
  MARK_SHIPPED_ERROR_CODE_INTERNAL                  = 5;
}

message MarkShippedError {
  MarkShippedErrorCode                  code    = 1;
  string                                message = 2;
  repeated identity.users.v1.FieldError fields  = 3;
}

// ---- ConfirmHandover --------------------------------------------------------

// ONE request for both courier delivery and self-pickup collection. There is no
// `handover_kind` field and none is needed: the order's delivery_method already says
// how the goods travelled, and the fact being recorded is the same either way — the
// buyer has them.
message ConfirmHandoverRequest { string order_id = 1; }

message ConfirmHandoverResponse {
  oneof result {
    ConfirmHandoverSuccess success = 1;
    ConfirmHandoverError   error   = 2;
  }
}

// For a LIVE order the returned order is in OBSERVATION with
// `observation_ends_at_ms` set; for GOODS it is COMPLETED.
message ConfirmHandoverSuccess { Order order = 1; }

enum ConfirmHandoverErrorCode {
  CONFIRM_HANDOVER_ERROR_CODE_UNSPECIFIED               = 0;
  CONFIRM_HANDOVER_ERROR_CODE_NOT_FOUND                 = 1;  // unknown/malformed id, or caller is not a party
  // A seller calling this is the clearest case: a party, but completion is the buyer's
  // to declare. A seller must never be able to close out their own sale.
  CONFIRM_HANDOVER_ERROR_CODE_FORBIDDEN_TRANSITION      = 2;
  CONFIRM_HANDOVER_ERROR_CODE_INVALID_STATUS_TRANSITION = 3;
  CONFIRM_HANDOVER_ERROR_CODE_INVALID_INPUT             = 4;
  CONFIRM_HANDOVER_ERROR_CODE_INTERNAL                  = 5;
}

message ConfirmHandoverError {
  ConfirmHandoverErrorCode              code    = 1;
  string                                message = 2;
  repeated identity.users.v1.FieldError fields  = 3;
}

// ---- CompleteOrder ----------------------------------------------------------

// The order id and nothing else. NO PARTY ID — the completing buyer is the
// authenticated caller in `x-authenticated-user-id` metadata, exactly as on every other
// transition RPC in this package. A body field naming the completing actor is precisely
// how a seller would complete their own sale.
message CompleteOrderRequest { string order_id = 1; }

message CompleteOrderResponse {
  oneof result {
    CompleteOrderSuccess success = 1;
    CompleteOrderError   error   = 2;
  }
}

// The returned order is COMPLETED with `completed_at_ms` set and
// `next_deadline_at_ms` cleared — the T3 sweep the buyer just pre-empted is no longer
// pending. Identical in shape to the state the sweeper would have produced, differing
// only in the ActorType recorded in `order_status_history`: BUYER here, SYSTEM there.
message CompleteOrderSuccess { Order order = 1; }

enum CompleteOrderErrorCode {
  COMPLETE_ORDER_ERROR_CODE_UNSPECIFIED               = 0;
  COMPLETE_ORDER_ERROR_CODE_NOT_FOUND                 = 1;  // unknown/malformed id, or caller is not a party
  // A SELLER calling this. They are a party to the order, but completion is the buyer's
  // to declare and the timer is the seller's only route to it. Never NOT_FOUND: the
  // seller can already read this order through GetOrder.
  COMPLETE_ORDER_ERROR_CODE_FORBIDDEN_TRANSITION      = 2;
  // Right caller, wrong moment. Includes a GOODS order already COMPLETED by
  // ConfirmHandover, and an order in REPLACEMENT_REQUESTED — a buyer who has filed a
  // claim completes by withdrawing it, not by this RPC.
  COMPLETE_ORDER_ERROR_CODE_INVALID_STATUS_TRANSITION = 3;
  COMPLETE_ORDER_ERROR_CODE_INVALID_INPUT             = 4;
  COMPLETE_ORDER_ERROR_CODE_INTERNAL                  = 5;
}

// No WINDOW_CLOSED code, deliberately, and it must not be added. A closed window is not
// an error on this edge: if T3 already fired the order is COMPLETED, which is the
// outcome the buyer was asking for. There is no late-completion failure to report.
message CompleteOrderError {
  CompleteOrderErrorCode                code    = 1;
  string                                message = 2;
  repeated identity.users.v1.FieldError fields  = 3;
}

// ---- RequestReplacement -----------------------------------------------------

message RequestReplacementRequest {
  string                         order_id = 1;
  repeated ReplacementClaimInput claims   = 2;  // >= 1; each item must belong to this order
}

message RequestReplacementResponse {
  oneof result {
    RequestReplacementSuccess success = 1;
    RequestReplacementError   error   = 2;
  }
}

message RequestReplacementSuccess {
  Order                     order  = 1;
  repeated ReplacementClaim claims = 2;  // as stored, with ids and timestamps assigned
}

enum RequestReplacementErrorCode {
  REQUEST_REPLACEMENT_ERROR_CODE_UNSPECIFIED               = 0;
  REQUEST_REPLACEMENT_ERROR_CODE_NOT_FOUND                 = 1;  // unknown/malformed id, or caller is not a party
  REQUEST_REPLACEMENT_ERROR_CODE_FORBIDDEN_TRANSITION      = 2;  // a party, but not the one entitled to this edge
  REQUEST_REPLACEMENT_ERROR_CODE_INVALID_STATUS_TRANSITION = 3;  // edge absent from the table for this status
  REQUEST_REPLACEMENT_ERROR_CODE_INVALID_INPUT             = 4;
  REQUEST_REPLACEMENT_ERROR_CODE_INTERNAL                  = 5;
  // The observation window has expired. A distinct code from
  // INVALID_STATUS_TRANSITION because the answer to the buyer is different: not "you
  // cannot do that here" but "the window this seller committed to has closed".
  REQUEST_REPLACEMENT_ERROR_CODE_WINDOW_CLOSED             = 6;
  // An `order_item_id` in the claim list does not belong to this order.
  REQUEST_REPLACEMENT_ERROR_CODE_ITEM_NOT_FOUND            = 7;
}

message RequestReplacementError {
  RequestReplacementErrorCode           code    = 1;
  string                                message = 2;
  repeated identity.users.v1.FieldError fields  = 3;
}

// ---- RespondToReplacement ---------------------------------------------------

message RespondToReplacementRequest {
  string          order_id      = 1;
  bool            accept        = 2;
  optional string response_note = 3;  // <= 500 chars, free text
}

message RespondToReplacementResponse {
  oneof result {
    RespondToReplacementSuccess success = 1;
    RespondToReplacementError   error   = 2;
  }
}

// With `accept = true` the parent order becomes CLOSED_REPLACED and a CHILD order is
// created and returned in `child_order` with `replacement_for_order_id` set and
// `replacement_generation` = 1.
//
// With `accept = false` the parent becomes CLOSED_UNRESOLVED with reason
// SELLER_REFUSED and `child_order` is ABSENT. A seller who simply never answers within
// T4 lands the order in the same state with reason SELLER_SILENT — the same ending,
// recorded as a different reason, because who argued and who ignored the buyer is the
// distinction that matters afterwards.
message RespondToReplacementSuccess {
  Order          order       = 1;
  optional Order child_order = 2;  // present only when accept = true
}

enum RespondToReplacementErrorCode {
  RESPOND_TO_REPLACEMENT_ERROR_CODE_UNSPECIFIED               = 0;
  RESPOND_TO_REPLACEMENT_ERROR_CODE_NOT_FOUND                 = 1;  // unknown/malformed id, or caller is not a party
  RESPOND_TO_REPLACEMENT_ERROR_CODE_FORBIDDEN_TRANSITION      = 2;  // a party, but not the one entitled to this edge
  RESPOND_TO_REPLACEMENT_ERROR_CODE_INVALID_STATUS_TRANSITION = 3;  // edge absent from the table for this status
  RESPOND_TO_REPLACEMENT_ERROR_CODE_INVALID_INPUT             = 4;
  RESPOND_TO_REPLACEMENT_ERROR_CODE_INTERNAL                  = 5;
  // The order is in a status that allows a response, but no claim is awaiting one —
  // it was already answered, or the buyer withdrew it.
  RESPOND_TO_REPLACEMENT_ERROR_CODE_NO_PENDING_CLAIM          = 6;
}

message RespondToReplacementError {
  RespondToReplacementErrorCode         code    = 1;
  string                                message = 2;
  repeated identity.users.v1.FieldError fields  = 3;
}

// ---- WithdrawReplacement ----------------------------------------------------

message WithdrawReplacementRequest { string order_id = 1; }

message WithdrawReplacementResponse {
  oneof result {
    WithdrawReplacementSuccess success = 1;
    WithdrawReplacementError   error   = 2;
  }
}

// The claim becomes WITHDRAWN and the order COMPLETED.
message WithdrawReplacementSuccess { Order order = 1; }

enum WithdrawReplacementErrorCode {
  WITHDRAW_REPLACEMENT_ERROR_CODE_UNSPECIFIED               = 0;
  WITHDRAW_REPLACEMENT_ERROR_CODE_NOT_FOUND                 = 1;  // unknown/malformed id, or caller is not a party
  WITHDRAW_REPLACEMENT_ERROR_CODE_FORBIDDEN_TRANSITION      = 2;  // a party, but not the one entitled to this edge
  WITHDRAW_REPLACEMENT_ERROR_CODE_INVALID_STATUS_TRANSITION = 3;  // edge absent from the table for this status
  WITHDRAW_REPLACEMENT_ERROR_CODE_INVALID_INPUT             = 4;
  WITHDRAW_REPLACEMENT_ERROR_CODE_INTERNAL                  = 5;
}

message WithdrawReplacementError {
  WithdrawReplacementErrorCode          code    = 1;
  string                                message = 2;
  repeated identity.users.v1.FieldError fields  = 3;
}

// ---- ReportNonDelivery ------------------------------------------------------

message ReportNonDeliveryRequest {
  string          order_id = 1;
  optional string note     = 2;  // <= 500 chars, free text
}

message ReportNonDeliveryResponse {
  oneof result {
    ReportNonDeliverySuccess success = 1;
    ReportNonDeliveryError   error   = 2;
  }
}

// The order becomes CLOSED_UNRESOLVED with reason NOT_DELIVERED. Nothing arrives, so
// there is nothing to observe and no replacement clock to start; the order is recorded
// as having ended without a remedy and stays that way.
message ReportNonDeliverySuccess { Order order = 1; }

enum ReportNonDeliveryErrorCode {
  REPORT_NON_DELIVERY_ERROR_CODE_UNSPECIFIED               = 0;
  REPORT_NON_DELIVERY_ERROR_CODE_NOT_FOUND                 = 1;  // unknown/malformed id, or caller is not a party
  REPORT_NON_DELIVERY_ERROR_CODE_FORBIDDEN_TRANSITION      = 2;  // a party, but not the one entitled to this edge
  REPORT_NON_DELIVERY_ERROR_CODE_INVALID_STATUS_TRANSITION = 3;  // edge absent from the table for this status
  REPORT_NON_DELIVERY_ERROR_CODE_INVALID_INPUT             = 4;
  REPORT_NON_DELIVERY_ERROR_CODE_INTERNAL                  = 5;
}

message ReportNonDeliveryError {
  ReportNonDeliveryErrorCode            code    = 1;
  string                                message = 2;
  repeated identity.users.v1.FieldError fields  = 3;
}

// ---- UploadClaimEvidence ----------------------------------------------------

// INLINE BINARY, up to 5 MiB — the first and only binary payload in this package. The
// gateway's orders client must raise its gRPC message-size limits accordingly; the
// tonic default of 4 MiB sits below the documented tier and would turn a legal upload
// into a transport error that looks like a service fault.
message UploadClaimEvidenceRequest {
  string order_id     = 1;
  bytes  file         = 2;  // <= 5 MiB
  string content_type = 3;  // image/jpeg, image/png, image/webp
}

message UploadClaimEvidenceResponse {
  oneof result {
    UploadClaimEvidenceSuccess success = 1;
    UploadClaimEvidenceError   error   = 2;
  }
}

// An OPAQUE PRIVATE-STORAGE KEY, not a URL. The buyer passes it back in
// `ReplacementClaimInput.evidence_keys`. Nothing serves this object over HTTP.
message UploadClaimEvidenceSuccess { string evidence_key = 1; }

enum UploadClaimEvidenceErrorCode {
  UPLOAD_CLAIM_EVIDENCE_ERROR_CODE_UNSPECIFIED               = 0;
  UPLOAD_CLAIM_EVIDENCE_ERROR_CODE_NOT_FOUND                 = 1;  // unknown/malformed id, or caller is not a party
  UPLOAD_CLAIM_EVIDENCE_ERROR_CODE_FORBIDDEN_TRANSITION      = 2;  // a party, but evidence is the buyer's to file
  UPLOAD_CLAIM_EVIDENCE_ERROR_CODE_INVALID_STATUS_TRANSITION = 3;  // the order cannot carry a claim in its current status
  UPLOAD_CLAIM_EVIDENCE_ERROR_CODE_INVALID_INPUT             = 4;
  UPLOAD_CLAIM_EVIDENCE_ERROR_CODE_INTERNAL                  = 5;
  UPLOAD_CLAIM_EVIDENCE_ERROR_CODE_PAYLOAD_TOO_LARGE         = 6;  // over 5 MiB
  UPLOAD_CLAIM_EVIDENCE_ERROR_CODE_UNSUPPORTED_CONTENT_TYPE  = 7;
  // The bytes arrived and were valid, but the private storage root rejected the write.
  // Distinct from INTERNAL so the client knows a retry is worth attempting.
  UPLOAD_CLAIM_EVIDENCE_ERROR_CODE_STORAGE_FAILURE           = 8;
}

message UploadClaimEvidenceError {
  UploadClaimEvidenceErrorCode          code    = 1;
  string                                message = 2;
  repeated identity.users.v1.FieldError fields  = 3;
}

// ---- GetSellerOrderStats ----------------------------------------------------
//
// INTERNAL. No gateway route exposes it in this release. It is a query, not a
// transition, so it has neither FORBIDDEN_TRANSITION nor INVALID_STATUS_TRANSITION.
//
// `seller_id` in the body is NOT a violation of the no-party-id rule above. That rule
// governs the CALLER's identity on client RPCs, which must come from metadata. Here the
// caller is another service asking about a third party, and the subject of the question
// has to be stated somewhere.
message GetSellerOrderStatsRequest { string seller_id = 1; }

message GetSellerOrderStatsResponse {
  oneof result {
    GetSellerOrderStatsSuccess success = 1;
    GetSellerOrderStatsError   error   = 2;
  }
}

message GetSellerOrderStatsSuccess {
  int32 completed_orders_count    = 1;
  int32 buyer_cancellation_count  = 2;  // cancellations by BUYERS against this seller
  int32 seller_cancellation_count = 3;  // cancellations by this seller after confirming
  int32 unresolved_count          = 4;
  // FALSE until the seller has enough completed orders for the ratio to mean anything.
  // A caller MUST NOT display unresolved_count when this is false, and MUST NOT display
  // it without completed_orders_count beside it when it is true: one refusal in fifty
  // reads differently from one in one, and only the pair is informative. Enforced here
  // rather than trusted to each client.
  bool  stats_display_eligible    = 5;
}

enum GetSellerOrderStatsErrorCode {
  GET_SELLER_ORDER_STATS_ERROR_CODE_UNSPECIFIED   = 0;
  GET_SELLER_ORDER_STATS_ERROR_CODE_INVALID_INPUT = 1;
  GET_SELLER_ORDER_STATS_ERROR_CODE_INTERNAL      = 2;
}

message GetSellerOrderStatsError {
  GetSellerOrderStatsErrorCode          code    = 1;
  string                                message = 2;
  repeated identity.users.v1.FieldError fields  = 3;
}
