  }
}
message GetOwnListingSuccess { Listing listing = 1; }
enum GetOwnListingErrorCode {
  GET_OWN_LISTING_ERROR_CODE_UNSPECIFIED = 0;
  GET_OWN_LISTING_ERROR_CODE_NOT_FOUND   = 1;  // also covers "belongs to another seller"
