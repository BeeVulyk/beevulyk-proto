// ---- GetPublicListing -------------------------------------------------------

message GetPublicListingRequest { string listing_id = 1; }
message GetPublicListingResponse {
  oneof result {
    GetPublicListingSuccess success = 1;
    GetPublicListingError   error   = 2;
  }
}
message GetPublicListingSuccess { PublicListing listing = 1; }
enum GetPublicListingErrorCode {
  GET_PUBLIC_LISTING_ERROR_CODE_UNSPECIFIED = 0;
  // Unknown id, OR any status other than ACTIVE / PAUSED. One code for both, so the
  // response cannot be used to discover that a blocked listing exists.
  GET_PUBLIC_LISTING_ERROR_CODE_NOT_FOUND   = 1;
  GET_PUBLIC_LISTING_ERROR_CODE_INTERNAL    = 2;
}
message GetPublicListingError { GetPublicListingErrorCode code = 1; string message = 2; }

// ---- GetListingForOrder -----------------------------------------------------

message GetListingForOrderRequest { string listing_id = 1; }
message GetListingForOrderResponse {
  oneof result {
    GetListingForOrderSuccess success = 1;
    GetListingForOrderError   error   = 2;
  }
}
message GetListingForOrderSuccess { ListingForOrder listing = 1; }
enum GetListingForOrderErrorCode {
  GET_LISTING_FOR_ORDER_ERROR_CODE_UNSPECIFIED = 0;
  // Unknown id only. Unlike GetPublicListing this RPC returns every status, because
  // the caller (orders-service) needs to see that a listing is CLOSED in order to
  // refuse the order for the right reason.
  GET_LISTING_FOR_ORDER_ERROR_CODE_NOT_FOUND   = 1;
  GET_LISTING_FOR_ORDER_ERROR_CODE_INTERNAL    = 2;
}
message GetListingForOrderError { GetListingForOrderErrorCode code = 1; string message = 2; }
