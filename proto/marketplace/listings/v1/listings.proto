// ---- ListOwnListings --------------------------------------------------------

message ListOwnListingsRequest {
  string                seller_id = 1;
  // Empty = every status. Repeated enum, never a CSV string. Any UNSPECIFIED member
  // is INVALID_INPUT.
  repeated ListingStatus statuses = 2;
  int32                 limit     = 3;  // 0 -> default 20; max 100
  int32                 offset    = 4;  // >= 0
}
message ListOwnListingsResponse {
  oneof result {
    ListOwnListingsSuccess success = 1;
    ListOwnListingsError   error   = 2;
  }
}
message ListOwnListingsSuccess {
  repeated ListingSummary listings = 1;  // created_at DESC
  int32                   total    = 2;  // total matching rows, ignoring limit/offset
}
enum ListOwnListingsErrorCode {
  LIST_OWN_LISTINGS_ERROR_CODE_UNSPECIFIED   = 0;
  LIST_OWN_LISTINGS_ERROR_CODE_INVALID_INPUT = 1;
  LIST_OWN_LISTINGS_ERROR_CODE_INTERNAL      = 2;
}
message ListOwnListingsError {
  ListOwnListingsErrorCode              code    = 1;
  string                                message = 2;
  repeated identity.users.v1.FieldError fields  = 3;
}

// ---- AddListingPhoto --------------------------------------------------------

message AddListingPhotoRequest {
  string seller_id    = 1;
  string listing_id   = 2;
  bytes  image        = 3;  // Full file body; the gateway enforces the 2 MiB cap first.
  string content_type = 4;  // MUST be image/png, image/jpeg or image/webp.
}
message AddListingPhotoResponse {
  oneof result {
    AddListingPhotoSuccess success = 1;
    AddListingPhotoError   error   = 2;
  }
}
message AddListingPhotoSuccess {
  ListingPhoto          photo  = 1;  // The newly created photo.
  repeated ListingPhoto photos = 2;  // Full gallery after the insert, position ASC.
}
enum AddListingPhotoErrorCode {
  ADD_LISTING_PHOTO_ERROR_CODE_UNSPECIFIED               = 0;
  ADD_LISTING_PHOTO_ERROR_CODE_INVALID_CONTENT_TYPE      = 1;
  ADD_LISTING_PHOTO_ERROR_CODE_TOO_LARGE                 = 2;
  ADD_LISTING_PHOTO_ERROR_CODE_TOO_MANY_PHOTOS           = 3;  // Cap is 8 per listing.
  ADD_LISTING_PHOTO_ERROR_CODE_NOT_FOUND                 = 4;  // No listing, or another seller's.
  ADD_LISTING_PHOTO_ERROR_CODE_INVALID_STATUS_TRANSITION = 5;  // CLOSED / ARCHIVED / BLOCKED
  ADD_LISTING_PHOTO_ERROR_CODE_STORAGE_FAILURE           = 6;
  ADD_LISTING_PHOTO_ERROR_CODE_INTERNAL                  = 7;
}
message AddListingPhotoError { AddListingPhotoErrorCode code = 1; string message = 2; }

// ---- DeleteListingPhoto -----------------------------------------------------

message DeleteListingPhotoRequest { string seller_id = 1; string listing_id = 2; string photo_id = 3; }
