  PAUSE_LISTING_ERROR_CODE_INVALID_STATUS_TRANSITION = 2;
  PAUSE_LISTING_ERROR_CODE_INTERNAL                  = 3;
}
message PauseListingError { PauseListingErrorCode code = 1; string message = 2; }

// ---- ResumeListing ----------------------------------------------------------
