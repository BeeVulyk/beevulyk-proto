message ResumeListingRequest { string seller_id = 1; string listing_id = 2; }
message ResumeListingResponse {
  oneof result {
    ResumeListingSuccess success = 1;
    ResumeListingError   error   = 2;
  }
}
message ResumeListingSuccess { Listing listing = 1; }
enum ResumeListingErrorCode {
  RESUME_LISTING_ERROR_CODE_UNSPECIFIED               = 0;
  // Any publish-gate rule failed. `fields` is ALWAYS populated — never a bare message.
  RESUME_LISTING_ERROR_CODE_INVALID_INPUT             = 1;
  RESUME_LISTING_ERROR_CODE_NOT_FOUND                 = 2;
  RESUME_LISTING_ERROR_CODE_INVALID_STATUS_TRANSITION = 3;
  RESUME_LISTING_ERROR_CODE_NOT_ELIGIBLE              = 4;
  RESUME_LISTING_ERROR_CODE_ELIGIBILITY_UNAVAILABLE   = 5;
  RESUME_LISTING_ERROR_CODE_INTERNAL                  = 6;
}
message ResumeListingError {
