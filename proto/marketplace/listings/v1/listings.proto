    DeleteListingPhotoSuccess success = 1;
    DeleteListingPhotoError   error   = 2;
  }
}
message DeleteListingPhotoSuccess { repeated ListingPhoto photos = 1; }  // renumbered 0..n-1
enum DeleteListingPhotoErrorCode {
  DELETE_LISTING_PHOTO_ERROR_CODE_UNSPECIFIED               = 0;
  DELETE_LISTING_PHOTO_ERROR_CODE_NOT_FOUND                 = 1;
  DELETE_LISTING_PHOTO_ERROR_CODE_PHOTO_NOT_FOUND           = 2;  // Also covers "belongs to another listing".
  DELETE_LISTING_PHOTO_ERROR_CODE_INVALID_STATUS_TRANSITION = 3;
  DELETE_LISTING_PHOTO_ERROR_CODE_INTERNAL                  = 4;
}
message DeleteListingPhotoError { DeleteListingPhotoErrorCode code = 1; string message = 2; }

